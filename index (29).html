<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --bg-void:#0A0E13;
  --bg-void-2:#0D131A;
  --surface:#141A22;
  --surface-raised:#1B222C;
  --surface-hover:#212a36;
  --border:#242E3A;
  --border-soft:#1B232D;
  --accent:#E8661C;
  --accent-soft:rgba(232,106,28,.14);
  --accent-text:#FF9152;
  --info:#4FA3FF;
  --info-soft:rgba(79,163,255,.14);
  --text:#EDEFF3;
  --text-dim:#B7C0CC;
  --text-muted:#7C8798;
  --success:#34D399;
  --success-soft:rgba(52,211,153,.14);
  --warning:#FBBF24;
  --warning-soft:rgba(251,191,36,.14);
  --caution:#FB923C;
  --caution-soft:rgba(251,146,60,.14);
  --danger:#F04438;
  --danger-soft:rgba(240,68,56,.14);
  --danger-dark:#B42318;
  --danger-dark-soft:rgba(180,35,24,.20);
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:16px;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(232,106,28,.08), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(79,163,255,.06), transparent 55%),
    var(--bg-void);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#33404f;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px;}

h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:.2px;margin:0;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);}
.mono{font-family:var(--font-mono);}

/* ===================== APP SHELL ===================== */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:72px;flex:0 0 72px;
  background:linear-gradient(180deg,var(--bg-void-2),#0A0E13);
  border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;align-items:center;
  padding:16px 0;gap:4px;position:sticky;top:0;height:100vh;z-index:20;
  transition:width .18s ease, flex-basis .18s ease;overflow:hidden;
}
.sidebar:hover{width:220px;flex-basis:220px;align-items:stretch;}
@media (min-width: 1100px){
  /* Sur grand écran (plein écran desktop), la sidebar reste toujours dépliée — pas besoin de survoler. */
  .sidebar{width:220px;flex-basis:220px;align-items:stretch;}
  .sidebar .word,.sidebar .sub{opacity:1;}
  .sidebar .nav-item .label{opacity:1;}
}
.sidebar-logo{
  display:flex;align-items:center;gap:10px;padding:6px 14px 18px 14px;white-space:nowrap;
}
.sidebar-logo .mark{
  width:34px;height:34px;border-radius:9px;flex:0 0 34px;
  background:linear-gradient(135deg,var(--accent),#a8480f);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:17px;color:#fff;
  box-shadow:0 4px 14px -4px rgba(232,106,28,.6);
}
.sidebar-logo .word{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.3px;opacity:0;transition:opacity .15s;}
.sidebar-logo .sub{display:block;font-size:10px;color:var(--text-muted);font-family:var(--font-body);font-weight:500;opacity:0;transition:opacity .15s;}
.sidebar:hover .word,.sidebar:hover .sub{opacity:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 19px;margin:1px 8px;border-radius:var(--radius-sm);
  color:var(--text-muted);cursor:pointer;white-space:nowrap;font-size:14px;font-weight:500;
  border:1px solid transparent;
}
.nav-item svg{flex:0 0 18px;width:18px;height:18px;}
.nav-item:hover{background:var(--surface-raised);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-text);border-color:rgba(232,106,28,.25);}
.nav-item .label{opacity:0;transition:opacity .12s;}
.sidebar:hover .nav-item .label{opacity:1;}
.nav-sep{height:1px;background:var(--border-soft);margin:8px 16px;}
.nav-spacer{flex:1;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:16px;
  padding:14px 28px;border-bottom:1px solid var(--border-soft);
  background:rgba(10,14,19,.82);backdrop-filter:blur(10px);
}
.topbar .ctx{color:var(--text-muted);font-size:13px;font-family:var(--font-mono);}
.topbar .spacer{flex:1;}
.select, select, input, textarea{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:8px 11px;font-family:var(--font-body);font-size:13.5px;
}
select:focus,input:focus,textarea:focus{border-color:var(--info);}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface-raised);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:9px 14px;font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:var(--font-body);
}
.btn:hover{background:var(--surface-hover);}
.btn-accent{background:linear-gradient(135deg,var(--accent),#b8501a);border-color:transparent;color:#fff;}
.btn-accent:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border-color:var(--border);}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-danger{color:var(--danger);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.content{padding:24px 28px 60px 28px;max-width:1520px;width:100%;margin:0 auto;}
.tab-panel{display:none;animation:fadein .18s ease;}
.tab-panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.panel-head h2{font-size:26px;}
.panel-head p{margin:4px 0 0 0;color:var(--text-muted);font-size:13.5px;}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

.card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:18px 20px;
}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-title h3{font-size:15px;font-family:var(--font-body);font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
@media(max-width:640px){.grid-4,.grid-3{grid-template-columns:1fr;}}

/* Scoreboard KPI */
.kpi{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:16px 18px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;
}
.kpi .eyebrow{margin-bottom:6px;}
.kpi .value{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;display:flex;align-items:baseline;gap:6px;}
.kpi .value .unit{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--text-muted);}
.kpi .delta{margin-top:6px;font-size:12px;color:var(--text-muted);font-family:var(--font-mono);}
.kpi .dot{position:absolute;top:16px;right:16px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 4px currentColor22;}
.kpi.tone-success .dot,.kpi.tone-success .value{color:var(--success);}
.kpi.tone-warning .dot,.kpi.tone-warning .value{color:var(--warning);}
.kpi.tone-danger .dot,.kpi.tone-danger .value{color:var(--danger);}
.kpi.tone-info .dot,.kpi.tone-info .value{color:var(--info);}
.kpi.tone-accent .dot,.kpi.tone-accent .value{color:var(--accent-text);}

/* Badges / status pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;}
.pill .dotsm{width:7px;height:7px;border-radius:50%;background:currentColor;}
.pill-success{background:var(--success-soft);color:var(--success);}
.pill-warning{background:var(--warning-soft);color:var(--warning);}
.pill-caution{background:var(--caution-soft);color:var(--caution);}
.pill-danger{background:var(--danger-soft);color:var(--danger);}
.pill-danger-dark{background:var(--danger-dark-soft);color:#ff6b57;}
.pill-info{background:var(--info-soft);color:var(--info);}
.pill-muted{background:var(--surface-raised);color:var(--text-muted);}

/* badge for field provenance */
.tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;font-weight:600;}
.tag-manual{background:var(--info-soft);color:var(--info);}
.tag-auto{background:var(--accent-soft);color:var(--accent-text);}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--surface-raised);}
.table-wrap{overflow-x:auto;border-radius:var(--radius);}
.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted);}
.empty-state h4{color:var(--text-dim);font-size:17px;margin-bottom:6px;}
.empty-state p{font-size:13.5px;margin:0 0 16px 0;}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;}
.field label{font-size:12px;font-weight:600;color:var(--text-dim);}
.field .hint{font-size:11px;color:var(--text-muted);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:560px){.field-row,.field-row3{grid-template-columns:1fr;}}
textarea{resize:vertical;min-height:60px;font-family:var(--font-body);}

/* Slider (wellness) */
.slider-field{background:var(--surface-raised);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
.slider-field .sfhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.slider-field .sfhead .lbl{font-size:13px;font-weight:600;}
.slider-field .sfhead .val{font-family:var(--font-display);font-size:22px;font-weight:800;}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:4px;background:var(--border);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff2;cursor:pointer;margin-top:-7px;}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;}
.scale-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono);}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(6,9,13,.68);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:640px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-size:19px;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:space-between;gap:10px;padding:16px 22px;border-top:1px solid var(--border-soft);}
.icon-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:4px;border-radius:6px;font-size:18px;line-height:1;}
.icon-btn:hover{background:var(--surface-raised);color:var(--text);}

/* Chips / filters */
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface-raised);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-dim);}
.chip.active{background:var(--accent-soft);border-color:rgba(232,106,28,.35);color:var(--accent-text);}

/* Fiche athlète */
.athlete-hero{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap;}
.avatar-ring{width:64px;height:64px;border-radius:50%;background:var(--surface-raised);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:22px;flex:0 0 64px;}
.athlete-name{font-size:28px;}
.athlete-sub{color:var(--text-muted);font-size:13px;margin-top:2px;}

.bar-track{height:8px;border-radius:5px;background:var(--border);overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;}

/* Body map */
.bodymap-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
.bodymap svg{width:180px;}
.bodymap-zone{fill:var(--surface-raised);stroke:var(--border);stroke-width:1.4;cursor:pointer;transition:fill .1s;}
.bodymap-zone:hover{fill:var(--info-soft);}
.bodymap-zone.selected{fill:var(--danger);stroke:var(--danger);}

/* Weekly planning grid */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.day-col .day-head{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;letter-spacing:.05em;}
.day-slot{background:var(--surface-raised);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;font-size:12px;cursor:pointer;min-height:54px;}
.day-slot:hover{border-color:var(--info);}
.day-slot.filled{border-style:solid;}
.day-slot .stitle{font-weight:700;margin-bottom:3px;}
.day-slot .smeta{color:var(--text-muted);font-size:11px;}
@media(max-width:1000px){.week-grid{grid-template-columns:repeat(2,1fr);}}

.help-text{color:var(--text-muted);font-size:12.5px;line-height:1.5;}
.divider{height:1px;background:var(--border-soft);margin:16px 0;}
.small-btn-row{display:flex;gap:8px;margin-top:8px;}
canvas{max-width:100%;}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);margin-top:10px;}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface-raised);border:1px solid var(--border);padding:12px 18px;border-radius:var(--radius);z-index:200;font-size:13.5px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);}
.loading-veil{position:fixed;inset:0;background:var(--bg-void);display:flex;align-items:center;justify-content:center;z-index:300;font-family:var(--font-mono);color:var(--text-muted);font-size:13px;letter-spacing:.05em;}
.priority-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.priority-item:last-child{border-bottom:none;}
.priority-rank{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text-muted);width:22px;}

/* Mode lien direct (email joueur) : uniquement la saisie wellness, sans navigation ni infos staff */
body.kiosk-mode .sidebar{display:none;}
body.kiosk-mode #group-filter{display:none;}
body.kiosk-mode .content{max-width:640px;}
.kiosk-banner{background:linear-gradient(135deg,var(--accent),#a8480f);color:#fff;padding:10px 16px;border-radius:var(--radius);margin-bottom:16px;font-size:13.5px;font-weight:600;text-align:center;}

.mark-img{width:38px;height:38px;object-fit:contain;flex:0 0 38px;filter:drop-shadow(0 3px 10px rgba(232,102,28,.4));}
.loading-veil img{width:180px;margin-bottom:16px;filter:drop-shadow(0 6px 20px rgba(232,102,28,.35));}

/* ============ NAVIGATION MOBILE / TABLETTE ============
   Sur petit écran, .sidebar devient une barre d'onglets fixe en bas, toujours visible
   et lisible sans survol (le survol n'existe pas au doigt) : plus d'icônes coupées/écrasées. */
@media(max-width:860px){
  .sidebar{
    position:fixed;left:0;right:0;bottom:0;top:auto;height:66px;width:100%;
    flex:0 0 auto;flex-basis:auto;
    flex-direction:row;align-items:stretch;justify-content:flex-start;
    padding:6px 4px;overflow-x:auto;overflow-y:hidden;
    border-right:none;border-top:1px solid var(--border-soft);gap:2px;
  }
  .sidebar:hover{width:100%;flex-basis:auto;}
  .sidebar-logo,.nav-spacer,.nav-sep,#sidebar-foot{display:none;}
  .nav-item{
    flex:0 0 auto;flex-direction:column;justify-content:center;align-items:center;gap:3px;
    padding:6px 12px;margin:0;min-width:68px;border-radius:10px;
  }
  .nav-item svg{width:20px;height:20px;}
  .nav-item .label{opacity:1;font-size:9.5px;font-weight:600;white-space:nowrap;}
  .main{padding-bottom:0;}
  .content{padding:16px 14px 86px 14px;}
  .topbar{padding:12px 14px;flex-wrap:wrap;row-gap:8px;}

  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3,.grid-2{grid-template-columns:1fr;}
  .week-grid{grid-template-columns:repeat(2,1fr);}
  .modal{margin-top:0;}
}
</style>

/* ---------------------- PVC — Pic de Vitesse de Croissance (Mirwald et al., 2002) ----------------------
   Référence : Mirwald RL, Baxter-Jones ADG, Bailey DA, Beunen GP. "An assessment of maturity from
   anthropometric measurements." Med Sci Sports Exerc. 2002.
   Formules exactes (coefficients validés) :
     Garçons : offset = -9.236 + 0.0002708×(LJ×TA) - 0.001663×(Age×LJ) + 0.007216×(Age×TA) + 0.02292×((Poids/Taille)×100)
     Filles  : offset = -9.376 + 0.0001882×(LJ×TA) + 0.0022×(Age×LJ) + 0.005841×(Age×TA) - 0.002658×(Age×Poids) + 0.07693×((Poids/Taille)×100)
   où LJ = longueur des jambes = Taille - Taille assise, TA = Taille assise, Age = âge décimal.
   "offset" = nombre d'années par rapport au pic (négatif = avant le pic, positif = après).
   Si la taille assise n'est pas renseignée, on utilise l'équation simplifiée de Moore et al. (2015)
   (Âge + Taille assise pour les garçons, Âge + Taille pour les filles) — moins précise mais fonctionnelle
   avec moins de mesures. */
function decimalAge(birthDateIso, atIso){
  if(!birthDateIso) return null;
  const b = new Date(birthDateIso+'T00:00:00'), a = new Date((atIso||todayISO())+'T00:00:00');
  if(isNaN(b)) return null;
  return (a-b)/(1000*60*60*24*365.25);
}
function pvcUnavailableReason(p){
  if(!p.birthDate) return "Il manque : date de naissance — le PVC se calculera dès qu'elle sera renseignée.";
  const age = decimalAge(p.birthDate);
  if(age!=null && (age<8 || age>25)) return `Le PVC ne s'applique qu'aux 8-25 ans — ce joueur a ${round1(age)} ans.`;
  if(!p.height) return "Il manque : taille — le PVC se calculera dès qu'elle sera renseignée.";
  return "Il manque : poids ou taille assise (pour affiner le calcul).";
}
function computePVC(p){
  const age = decimalAge(p.birthDate);
  const height = Number(p.height)||null, weight = Number(p.weight)||null, sitHeight = Number(p.sittingHeight)||null;
  const sex = p.sex==='F' ? 'F' : 'M';
  if(age==null || age<8 || age>25) return null; // équations validées scientifiquement pour 8-18 ans ; tolérance étendue à 25 ans à la demande, résultat au-delà de 18 ans à prendre avec plus de prudence (extrapolation).
  let offset = null, method = null;
  if(height && weight && sitHeight){
    const legLength = height - sitHeight;
    if(sex==='M'){
      offset = -9.236 + 0.0002708*(legLength*sitHeight) - 0.001663*(age*legLength) + 0.007216*(age*sitHeight) + 0.02292*((weight/height)*100);
    } else {
      offset = -9.376 + 0.0001882*(legLength*sitHeight) + 0.0022*(age*legLength) + 0.005841*(age*sitHeight) - 0.002658*(age*weight) + 0.07693*((weight/height)*100);
    }
    method = 'Mirwald (2002) — complet';
  } else if(height && sex==='M'){
    offset = -8.128741 + 0.0070346*(age*height); // Moore-2 simplifiée (garçons, sans taille assise)
    method = 'Moore (2015) — simplifiée, taille assise non renseignée';
  } else if(height && sex==='F'){
    offset = -7.709133 + 0.0042232*(age*height); // Moore simplifiée (filles)
    method = 'Moore (2015) — simplifiée, taille assise non renseignée';
  } else {
    return null; // pas assez de données (taille manquante au minimum)
  }
  const ageAtPHV = age - offset;
  // 5 stades, alignés sur le document de référence "Méthode PVC Mirwald" (Pôle Espoirs Ligue Région Sud FFHandball).
  let statusLabel, statusTone;
  if(offset <= -1){ statusLabel='Pré-PVC'; statusTone='info'; }
  else if(offset <= 0){ statusLabel='Pré-PVC tardif'; statusTone='info'; }
  else if(offset <= 1){ statusLabel='Circa-PVC'; statusTone='warning'; }
  else if(offset <= 2){ statusLabel='Post-PVC'; statusTone='success'; }
  else { statusLabel='Post-PVC tardif'; statusTone='success'; }
  return { offset: round1(offset), ageAtPHV: round1(ageAtPHV), method, statusLabel, statusTone, age: round1(age) };
}
// Taille adulte prévisionnelle — deux méthodes calculées systématiquement (quand les données le permettent),
// affichées ensemble (moyenne des deux) mais consultables séparément :
// 1) Taille cible parentale (méthode Tanner) : Garçons (père+mère+13)/2 · Filles (père+mère-13)/2, ±8.5cm.
// 2) % de taille adulte atteinte selon l'écart au PVC — table alignée sur le document de référence du
//    pôle ("Méthode PVC Mirwald", Pôle Espoirs Ligue Région Sud FFHandball) : ≤-1an→88% ; ≤0→92% ; ≤1→95% ;
//    ≤2→98% ; >2→99%. Marge ±5,4cm (repère du même document).
function predictedAdultHeight(p, pvc){
  const height = Number(p.height)||null;
  const fatherH = Number(p.fatherHeight)||null, motherH = Number(p.motherHeight)||null;
  const results = [];

  if(fatherH && motherH){
    const sex = p.sex==='F' ? 'F' : 'M';
    const target = sex==='M' ? (fatherH+motherH+13)/2 : (fatherH+motherH-13)/2;
    results.push({ key:'tanner', height: round0(target), range: 8.5, label:'Taille cible parentale (Tanner)' });
  }
  if(height && pvc){
    const off = pvc.offset;
    let pctAH;
    if(off <= -1) pctAH = 0.88;
    else if(off <= 0) pctAH = 0.92;
    else if(off <= 1) pctAH = 0.95;
    else if(off <= 2) pctAH = 0.98;
    else pctAH = 0.99;
    results.push({ key:'pctah', height: round0(height/pctAH), range:5.4, pct: round0(pctAH*100), label:'% de taille adulte atteinte (PVC)' });
  }
  if(!results.length) return null;
  const avg = round0(mean(results.map(r=>r.height)));
  const reserve = height? round0(avg-height) : null;
  return { height: avg, results, reserve, both: results.length===2 };
}
// Une blessure "active" ne l'est plus si sa date de reprise théorique est déjà passée : on considère
// alors le joueur rétabli automatiquement, sans action manuelle nécessaire (sauf si le staff a prolongé
// la date de retour lui-même, auquel cas on respecte la nouvelle date).
function isInjuryStillActive(p){
  if(!p.injuryState || p.injuryState==='none') return false;
  if(p.returnDate && p.returnDate < todayISO()) return false; // reprise théorique dépassée -> rétabli
  return true;
}

async function addMeasurement(player, data){

function pctChange(oldV, newV){
  if(oldV==null || newV==null || oldV===0) return null;
  return round1(((newV-oldV)/Math.abs(oldV))*100);
}

function computeStatus(p){
  if(isInjuryStillActive(p)) return p.injuryState==='blesse' ? 'blesse' : 'retour_progressif';
  const m = loadMetrics(p.id);
  if(m.acwr!=null && m.acwr>=1.5) return 'alerte_charge';

}

function computeAvailability(p){
  if(!isInjuryStillActive(p)) return 'Disponible';
  return p.injuryState==='blesse' ? 'Indisponible' : 'Limité';
}

/* ---------------------- ESTIMATION DE LA DATE DE RETOUR (littérature sportive) ----------------------
   Ordres de grandeur indicatifs par TYPE de blessure × zone × grade — pas un avis médical, juste un
   point de départ pour la planification (le staff médical/kiné a toujours le dernier mot). Repères
   utilisés (fourchettes basses à moyennes, cohérentes avec la littérature courante) :
   - Entorses (Grade 1/2/3) : cheville ~1-3/3-6/8-12+ sem. (StatPearls, AAOS) ; genou et épaule plus longs
     au grade 3 (atteinte ligamentaire plus lourde) ; main/doigt plus rapide.
   - Élongations/déchirures musculaires (Grade 1/2/3) : ~1-2/3-6/8-12 sem. (classification courante).
   - Contusions : généralement courtes (quelques jours à 4 sem. au grade 3, hématome profond).
   - Tendinites : évolution plus lente/chronique, tendon d'Achille notamment plus long.
   - Fractures/luxations : consolidation osseuse ou réduction, délai selon la zone (main plus rapide
     qu'un os portant comme la cheville ou le genou). */
const ZONE_REHAB_CATEGORY = (()=>{
  const map = {};
  ['cheville_g','cheville_d'].forEach(z=>map[z]='cheville');
  ['genou_g','genou_d'].forEach(z=>map[z]='genou');
  ['epaule_g','epaule_d'].forEach(z=>map[z]='epaule');
  ['achille_g','achille_d'].forEach(z=>map[z]='tendon');
  ['main_g','main_d'].forEach(z=>map[z]='main');
  ['ischios_g','ischios_d','quadriceps_g','quadriceps_d','adducteurs_g','adducteurs_d','mollets_g','mollets_d',
   'biceps_g','biceps_d','triceps_g','triceps_d','pectoraux','abdominaux','dorsaux','lombaires',
   'fessiers_g','fessiers_d','avant_bras_g','avant_bras_d','trapezes_g','trapezes_d'].forEach(z=>map[z]='muscle');
  return map;
})();
const GRADE_MULT = { grade1:1, grade2:1.35, grade3:1.8 };
const REHAB_BY_TYPE = {
  'Entorse': { cheville:{g1:2,g2:5,g3:10}, genou:{g1:2,g2:6,g3:16}, epaule:{g1:2,g2:5,g3:10}, main:{g1:1,g2:3,g3:6}, tendon:{g1:2,g2:5,g3:9}, muscle:{g1:2,g2:4,g3:8}, autre:{g1:2,g2:4,g3:8} },
  'Élongation / Déchirure musculaire': { muscle:{g1:2,g2:4,g3:9}, autre:{g1:2,g2:4,g3:9} },
  'Contusion': { autre:{g1:1,g2:2,g3:4} },
  'Tendinite': { tendon:{g1:3,g2:6,g3:12}, autre:{g1:2,g2:4,g3:8} },
  'Fracture': { main:{g1:4},  cheville:{g1:8}, genou:{g1:10}, epaule:{g1:8}, tendon:{g1:8}, muscle:{g1:8}, autre:{g1:8} },
  'Luxation': { epaule:{g1:5}, main:{g1:3}, genou:{g1:10}, cheville:{g1:6}, tendon:{g1:6}, muscle:{g1:6}, autre:{g1:5} },
  'Commotion': { autre:{g1:2,g2:2,g3:3} },
  'Autre': { autre:{g1:2,g2:4,g3:8} },
};
function estimateRehabWeeks(type, zone, grade){
  const cat = ZONE_REHAB_CATEGORY[zone] || 'autre';
  const typeTable = REHAB_BY_TYPE[type] || REHAB_BY_TYPE['Autre'];
  const zoneTable = typeTable[cat] || typeTable.autre || REHAB_BY_TYPE['Autre'].autre;
  // Fracture/Luxation : une seule base par zone (g1), modulée par le grade comme facteur de gravité.
  if(type==='Fracture' || type==='Luxation'){
    const base = zoneTable.g1 ?? 6;
    return { weeks: Math.round(base * (GRADE_MULT[grade]||1)), category: cat };
  }
  const weeks = zoneTable[grade==='grade1'?'g1':grade==='grade3'?'g3':'g2'] ?? zoneTable.g2 ?? 4;
  return { weeks, category: cat };
}

// Zone(s) fragile(s) calculée automatiquement : toute zone touchée 2 fois ou plus dans l'historique.
function computeFragileZones(playerId){
  const counts = {};
  playerInjuries(playerId).forEach(i=>{ counts[i.zone] = (counts[i.zone]||0)+1; });
  return Object.entries(counts).filter(([,c])=>c>=2).map(([zone,count])=>({zone, label:BODY_ZONE_LABEL[zone]||zone, count})).sort((a,b)=>b.count-a.count);
}

// Alertes : récidive (3 blessures ou plus sur la même zone) + antécédent de grade sévère (fracture/rupture).
function computeInjuryAlerts(playerId){
  const alerts = [];
  const counts = {};
  playerInjuries(playerId).forEach(i=>{ counts[i.zone] = (counts[i.zone]||0)+1; });
  Object.entries(counts).forEach(([zone,count])=>{
    if(count>=3){ alerts.push({tone:'danger', label:'Blessures récidivantes', detail:(BODY_ZONE_LABEL[zone]||zone)+' — '+count+' épisodes'}); }
  });
  playerInjuries(playerId).forEach(i=>{
    if(isSevereInjury(i)){
      alerts.push({tone:'danger-dark', label:'Antécédent sévère', detail:(BODY_ZONE_LABEL[i.zone]||i.zone)+' — '+(i.type||injuryGradeInfo(i.grade).label)+' ('+fmtDate(i.date)+')'});
    }
  });
  return alerts;
}

/* ---------------------- PERSISTANCE (Firebase Realtime Database) ----------------------
   Toutes les données vivent sous le nœud /fablab dans la base de données du projet
   "fab-lab-44695". Comme il n'y a pas de compte utilisateur, tout le monde qui a l'appli

let suppressRerender = false; // évite de re-render pendant qu'on écrit nous-mêmes

async function saveCollection(name){
  try{
    await fbDB.ref('fablab/'+name).set(state[name]);
  }catch(e){ console.error('Erreur de sauvegarde', name, e); showToast('Erreur de sauvegarde ('+name+') — vérifiez la connexion internet.'); }
}
async function loadCollection(name){
  try{
    const snap = await fbDB.ref('fablab/'+name).once('value');
    const val = snap.val();
    if(val!=null){ state[name] = val; }
  }catch(e){ console.error('Erreur de chargement', name, e); }
}
async function loadAll(){
  await Promise.all(STORE_KEYS.map(loadCollection));
  if(!state.settings || !state.settings.groups || !state.settings.groups.length){
    state.settings = { groups:[...DEFAULT_GROUPS] };
  }
  // Les tableaux vides stockés dans Firebase reviennent parfois sous forme d'objet {} : on sécurise le type.
  ['players','wellness','loads','tests','sessions','planning','injuries','measurements'].forEach(k=>{
    if(!Array.isArray(state[k])) state[k] = state[k] ? Object.values(state[k]) : [];
  });
}
async function persist(name){ await saveCollection(name); }

/* Synchronisation en direct : si un autre appareil modifie une collection, on met à jour
   notre état local et on redessine l'onglet actif — sans que personne n'ait besoin de rafraîchir. */
function attachLiveSync(){
  STORE_KEYS.forEach(name=>{
    fbDB.ref('fablab/'+name).on('value', snap=>{
      if(suppressRerender) return;
      const val = snap.val();
      if(name==='settings'){
        state.settings = (val && val.groups && val.groups.length)? val : {groups:[...DEFAULT_GROUPS]};
      } else {
        state[name] = Array.isArray(val) ? val : (val? Object.values(val) : []);
      }
      if(document.getElementById('app-shell').style.visibility!=='hidden'){
        refreshGroupFilterSelect();
        renderTab(state.ui.tab);
      }
    });
  });
}

function fmtDate(d){ if(!d) return '—'; const dt = (d instanceof Date)? d : new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
// IMPORTANT : on formate à partir des composants de date LOCALE (getFullYear/getMonth/getDate),
// jamais via toISOString() qui convertit en UTC et décale d'un jour pour tous les fuseaux
// horaires en avance sur UTC (dont la France) — c'est ce qui causait le bug "24/07 = dimanche".
function toISODateLocal(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return toISODateLocal(new Date()); }
function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISODateLocal(d); }
function isoRange(endIso, days){ const arr=[]; for(let i=days-1;i>=0;i--){ arr.push(addDays(endIso,-i)); } return arr; }
function mean(arr){ return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function stdev(arr){ if(arr.length<2) return 0; const m=mean(arr); return Math.sqrt(mean(arr.map(v=>(v-m)*(v-m)))); }
function round1(v){ return Math.round(v*10)/10; }
function round0(v){ return Math.round(v); }
function playerName(p){ return p ? (p.firstName+' '+p.lastName.toUpperCase()) : '—'; }
function playerById(id){ return state.players.find(p=>p.id===id); }
function ageFromBirth(iso){ if(!iso) return null; const b=new Date(iso+'T00:00:00'); const t=new Date(); let a=t.getFullYear()-b.getFullYear(); const m=t.getMonth()-b.getMonth(); if(m<0||(m===0&&t.getDate()<b.getDate())) a--; return a; }
function initials(p){ return ((p.firstName||' ')[0]+(p.lastName||' ')[0]).toUpperCase(); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg){
  const root = document.getElementById('toast-root');

  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2400);
}

// --- WELLNESS ---
// Items positifs (plus haut = mieux) et négatifs (plus haut = pire, on inverse 6-v)
const WELLNESS_POS = ['sleep','motivation','mood','freshness'];
const WELLNESS_NEG_5 = ['fatigue','soreness','stress']; // échelle 1-5
// La douleur est saisie sur une échelle 1-10 (plus précise) : on la ramène sur 1-5 avant de l'intégrer au score.
function painOn5(entry){ const p = Number(entry.pain)||1; return 1 + (p-1)*(4/9); }

function computeWellnessScore(entry){
  const pos = WELLNESS_POS.map(k=>Number(entry[k])||0);
  const neg = WELLNESS_NEG_5.map(k=>6-(Number(entry[k])||0));
  neg.push(6-painOn5(entry));
  const all = pos.concat(neg);
  return round0(mean(all)/5*100);
}

function wellnessHistory(playerId, days=28, endIso=todayISO()){
  const from = addDays(endIso, -(days-1));
  return state.wellness.filter(w=>w.playerId===playerId && w.date>=from && w.date<=endIso).sort((a,b)=>a.date.localeCompare(b.date));
}

function latestWellness(playerId){
  const list = state.wellness.filter(w=>w.playerId===playerId).sort((a,b)=>b.date.localeCompare(a.date));
  return list[0] || null;
}

// --- CHARGE ---
// RPE effectif : priorité au RPE du joueur (méthode sRPE standard), puis RPE coach, puis ancien champ générique.
function effectiveRPE(entry){ return Number(entry.playerRPE ?? entry.coachRPE ?? entry.rpe ?? 0) || 0; }
function dailyLoadSeries(playerId, endIso, days){
  const dates = isoRange(endIso, days);
  const byDate = {};
  state.loads.filter(l=>l.playerId===playerId).forEach(l=>{
    byDate[l.date] = (byDate[l.date]||0) + (Number(l.duration)||0)*effectiveRPE(l);
  });
  return dates.map(d=>({date:d, load: byDate[d]||0}));
}

// Charge aiguë (7j) et chronique (28j) : moyennes glissantes journalières (méthode "rolling average"),
// plus robuste aux jours manquants que la somme glissante brute et davantage utilisée en pratique récente (limite les artefacts de calcul de Gabbett et al.).
function loadMetrics(playerId, endIso=todayISO()){
  const series28 = dailyLoadSeries(playerId, endIso, 28);
  const last7 = series28.slice(-7).map(d=>d.load);
  const last28 = series28.map(d=>d.load);
  const acute = mean(last7);
  const chronic = mean(last28);
  const acwr = chronic>0 ? acute/chronic : null;
  const weeklyLoad = last7.reduce((a,b)=>a+b,0);
  const sd = stdev(last7);
  const monotony = sd>0 ? mean(last7)/sd : null;
  const strain = (monotony!=null) ? weeklyLoad*monotony : null;
  return { series28, acute, chronic, acwr, weeklyLoad, monotony, strain, sd };
}

function teamAverageMetrics(endIso=todayISO()){
  const ids = playersInScope().map(p=>p.id);
  if(!ids.length) return {acute:0,chronic:0,acwr:null,weeklyLoad:0,monotony:null};
  const all = ids.map(id=>loadMetrics(id, endIso));
  return {
    acute: mean(all.map(m=>m.acute)),
    chronic: mean(all.map(m=>m.chronic)),
    acwr: mean(all.filter(m=>m.acwr!=null).map(m=>m.acwr)) || null,
    weeklyLoad: mean(all.map(m=>m.weeklyLoad)),
    monotony: mean(all.filter(m=>m.monotony!=null).map(m=>m.monotony)) || null,
    wellness: mean(ids.map(id=>{ const w=latestWellness(id); return w? computeWellnessScore(w):null; }).filter(v=>v!=null)) || null,
  };
}

// --- TESTS : deltas ---
function playerTestHistory(playerId, key){
  return state.tests.filter(t=>t.playerId===playerId && t.testKey===key).sort((a,b)=>a.date.localeCompare(b.date));
}
function testDeltas(playerId, key, value, dateExcludingId){
  const hist = playerTestHistory(playerId, key).filter(t=>t.id!==dateExcludingId);
  const def = TEST_INDEX[key];
  let deltaLast=null, pctLast=null, deltaBest=null, best=null;
  if(hist.length){
    const prev = hist[hist.length-1];
    deltaLast = round1(value - prev.value);
    pctLast = prev.value!==0 ? round1((value-prev.value)/Math.abs(prev.value)*100) : null;
    best = def.better==='lower' ? Math.min(...hist.map(t=>t.value)) : Math.max(...hist.map(t=>t.value));
    deltaBest = round1(value-best);
  }
  return {deltaLast, pctLast, deltaBest, best};
}
function latestTestValue(playerId, key){
  const hist = playerTestHistory(playerId, key);
  return hist.length? hist[hist.length-1].value : null;
}

// Points d'amélioration prioritaires : écart (normalisé, sens pris en compte) du joueur vs moyenne d'équipe sur chaque test renseigné
function priorityImprovements(playerId, limit=3){
  const scope = playersInScope().filter(p=>p.id!==playerId);
  const results = [];
  Object.values(TEST_INDEX).forEach(def=>{
    const val = latestTestValue(playerId, def.key);
    if(val==null) return;
    const teamVals = scope.map(p=>latestTestValue(p.id, def.key)).filter(v=>v!=null);
    if(teamVals.length<1) return;
    const avg = mean(teamVals);
    const sd = stdev(teamVals) || Math.abs(avg)*0.1 || 1;
    let gap = (val-avg)/sd; // z-score
    if(def.better==='lower') gap = -gap; // pour les tests "plus bas = mieux", on inverse le sens de l'écart
    results.push({ key:def.key, label: def.label, cat: def.cat, improvementLabel: IMPROVEMENT_LABELS[def.key], gap, val, avg:round1(avg), unit:def.unit });
  });
  results.sort((a,b)=>a.gap-b.gap);
  return results.slice(0, limit);
}

function buildAlerts(){
  const alerts = [];
  playersInScope().forEach(p=>{
    const m = loadMetrics(p.id);
    const w = latestWellness(p.id);
    if(isInjuryStillActive(p) && p.injuryState==='blesse'){ alerts.push({playerId:p.id, tone:'danger', label:'Joueur blessé', detail:p.returnDate? 'Retour prévu '+fmtDate(p.returnDate) : ''}); }
    if(m.acwr!=null && m.acwr>=1.5){ alerts.push({playerId:p.id, tone:'danger', label:'ACWR élevé', detail:'ACWR '+round1(m.acwr)}); }
    if(m.monotony!=null && m.monotony>=2.5){ alerts.push({playerId:p.id, tone:'caution', label:'Monotonie très élevée', detail:'Monotonie '+round1(m.monotony)}); }
    if(w){ const score = computeWellnessScore(w); if(score<40){ alerts.push({playerId:p.id, tone:'danger', label:'Wellness critique', detail:score+'/100'}); } }
    computeInjuryAlerts(p.id).forEach(a=>alerts.push({playerId:p.id, ...a}));
  });
  return alerts;
}

function teamWeeklyLoadTrend(weeks=8){
  const out = [];
  for(let i=weeks-1;i>=0;i--){
    const endIso = addDays(todayISO(), -i*7);
    const scope = playersInScope();
    const avgWeekly = scope.length? mean(scope.map(p=>{
      const s = dailyLoadSeries(p.id, endIso, 7);
      return s.reduce((a,b)=>a+b.load,0);
    })) : 0;
    out.push({label: fmtDate(addDays(endIso,-6))+' → '+fmtDate(endIso), value: round0(avgWeekly)});
  }
  return out;
}

function teamWellnessTrend(days=14){
  const dates = isoRange(todayISO(), days);
  const scope = playersInScope();
  return dates.map(d=>{
    const vals = scope.map(p=>{
      const w = state.wellness.find(x=>x.playerId===p.id && x.date===d);
      return w? computeWellnessScore(w): null;
    }).filter(v=>v!=null);
    return {label: fmtDate(d), value: vals.length? round0(mean(vals)) : null};
  });
}

const PRINT_TONE_HEX = { success:'#1a9c6d', warning:'#c98a12', caution:'#d2691e', danger:'#c0392b', 'danger-dark':'#8e2418', info:'#2f6fb5', accent:'#c9560f', muted:'#888888' };

function reportScopePlayers(group){ return (group && group!=='__all__') ? state.players.filter(p=>p.group===group) : state.players; }

// Rend un graphique Chart.js hors écran et retourne une image (data URL) — utilisé uniquement pour le PDF.
function renderOffscreenChartImage(config){
  const canvas = document.createElement('canvas');
  canvas.width = 720; canvas.height = 320;
  canvas.style.position = 'fixed'; canvas.style.left = '-9999px'; canvas.style.top = '0';
  document.body.appendChild(canvas);
  config.options = config.options || {};
  config.options.animation = false;
  config.options.responsive = false;
  config.options.devicePixelRatio = 2;
  const chart = new Chart(canvas.getContext('2d'), config);
  const img = chart.toBase64Image('image/png', 1);
  chart.destroy();
  canvas.remove();
  return img;
}

function openWeeklyReportForm(){
  const defaultWeekStart = startOfWeek(todayISO());
  const defaultWeekEnd = addDays(defaultWeekStart, 6);
  openModal({
    title: "Bilan de la semaine",
    submitLabel: 'Générer le bilan PDF',
    bodyHtml: `
      <div class="field"><label>Semaine</label><input type="date" name="weekStart" value="${defaultWeekStart}"><p class="hint" style="margin-top:4px;">Choisissez n'importe quel jour de la semaine voulue (${fmtDate(defaultWeekStart)} → ${fmtDate(defaultWeekEnd)} par défaut) — le bilan couvre toujours du lundi au dimanche.</p></div>
      <div class="field"><label>Groupe</label><select name="group">${groupOptionsHtml(state.ui.groupFilter, true)}</select></div>
      <div class="field"><label>Notes de la semaine (optionnel)</label><textarea name="notes" placeholder="Ce qu'il faut retenir de cette semaine, points d'attention, décisions…"></textarea></div>
    `,
    onSubmit: async (fd, close)=>{
      const rawStart = fd.get('weekStart') || defaultWeekStart;
      const weekStart = startOfWeek(rawStart);
      const weekEnd = addDays(weekStart, 6);
      const group = fd.get('group');
      const notes = fd.get('notes')||'';
      close();
      try{ generateWeeklyReport(weekStart, weekEnd, group, notes); }
      catch(e){ console.error(e); showToast('Erreur lors de la génération du bilan.'); }
    }
  });
}

function generateWeeklyReport(weekStart, weekEnd, group, notes){
  const scope = reportScopePlayers(group);
  const scopeIds = new Set(scope.map(p=>p.id));
  const weekDays = isoRange(weekEnd, 7); // exactement weekStart..weekEnd (lundi->dimanche)
  const groupLabel = (group && group!=='__all__') ? group : 'Tout l\u2019effectif';

  /* --- Séances de la semaine --- */
  const weekLoads = state.loads.filter(l=> l.date>=weekStart && l.date<=weekEnd && scopeIds.has(l.playerId));
  const sessionGroups = groupLoadsBySession(weekLoads).sort((a,b)=>a.date.localeCompare(b.date));

  /* --- Charge de la semaine --- */
  const teamMetricsWeek = (()=>{
    if(!scope.length) return {acwr:null, monotony:null, weeklyLoad:0};
    const all = scope.map(p=>loadMetrics(p.id, weekEnd));
    return {
      acwr: mean(all.filter(m=>m.acwr!=null).map(m=>m.acwr)) || null,
      monotony: mean(all.filter(m=>m.monotony!=null).map(m=>m.monotony)) || null,
      weeklyLoad: mean(all.map(m=>m.weeklyLoad)),
    };
  })();
  const teamDailyLoad = weekDays.map(d=>{
    const vals = scope.map(p=>{
      return state.loads.filter(l=>l.playerId===p.id && l.date===d).reduce((a,l)=>a+(Number(l.duration)||0)*effectiveRPE(l),0);
    });
    return { date:d, avg: mean(vals) };
  });

  /* --- Wellness de la semaine --- */
  const weekWellness = state.wellness.filter(w=> w.date>=weekStart && w.date<=weekEnd && scopeIds.has(w.playerId));
  const avgScoreWeek = weekWellness.length? mean(weekWellness.map(computeWellnessScore)) : null;
  const dailyWellness = weekDays.map(d=>{
    const entries = weekWellness.filter(w=>w.date===d);
    return { date:d, avg: entries.length? mean(entries.map(computeWellnessScore)) : null, responded: entries.length };
  });
  const avgResponseRate = scope.length? mean(dailyWellness.map(d=> d.responded/scope.length*100)) : 0;

  /* --- Comparatif RPE coach vs RPE joueurs --- */
  const rpeComparison = sessionGroups.map(g=>{
    const withPlayerRPE = g.entries.filter(e=>e.playerRPE!=null);
    return {
      label: (g.sessionName||g.sessionCode||'Séance').slice(0,18)+' '+fmtDate(g.date),
      coachRPE: g.coachRPE, avgPlayerRPE: withPlayerRPE.length? mean(withPlayerRPE.map(e=>e.playerRPE)) : null,
      responded: withPlayerRPE.length, total: g.entries.length,
    };
  });

  /* --- Graphiques (rendus hors écran puis convertis en image) --- */
  const chargeChartImg = renderOffscreenChartImage({
    type:'bar',
    data:{ labels: teamDailyLoad.map(d=>fmtDate(d.date)), datasets:[{ label:'Charge moyenne équipe', data: teamDailyLoad.map(d=>round0(d.avg)), backgroundColor: PRINT_COLORS.accent, borderRadius:5, maxBarThickness:46 }] },
    options:{ plugins:{legend:{display:false}, title:{display:false}}, scales:{ x:{ticks:{color:PRINT_COLORS.text, font:{family:'Inter'}}, grid:{display:false}}, y:{ticks:{color:PRINT_COLORS.text, font:{family:'Inter'}}, grid:{color:PRINT_COLORS.grid}} } }
  });
  const wellnessChartImg = renderOffscreenChartImage({
    type:'line',
    data:{ labels: dailyWellness.map(d=>fmtDate(d.date)), datasets:[{ label:'Wellness moyen', data: dailyWellness.map(d=>d.avg!=null?round0(d.avg):null), borderColor: PRINT_COLORS.info, backgroundColor: PRINT_COLORS.infoSoft, fill:true, spanGaps:true, tension:.3, pointRadius:5, borderWidth:2.5 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:PRINT_COLORS.text, font:{family:'Inter'}}, grid:{display:false}}, y:{min:0,max:100,ticks:{color:PRINT_COLORS.text, font:{family:'Inter'}}, grid:{color:PRINT_COLORS.grid}} } }
  });
  const rpeChartImg = !rpeComparison.length? null : renderOffscreenChartImage({
    type:'bar',
    data:{
      labels: rpeComparison.map(r=>r.label),
      datasets:[
        { label:'RPE coach', data: rpeComparison.map(r=>r.coachRPE), backgroundColor: PRINT_COLORS.accent, borderRadius:5, maxBarThickness:26 },
        { label:'RPE joueurs (moyenne)', data: rpeComparison.map(r=>r.avgPlayerRPE), backgroundColor: PRINT_COLORS.info, borderRadius:5, maxBarThickness:26 },
      ]
    },
    options:{ plugins:{legend:{display:true, position:'bottom', labels:{color:PRINT_COLORS.text, font:{family:'Inter'}}}}, scales:{ x:{ticks:{color:PRINT_COLORS.text, maxRotation:35, minRotation:35, font:{family:'Inter'}}, grid:{display:false}}, y:{min:0,max:10,ticks:{color:PRINT_COLORS.text, font:{family:'Inter'}}, grid:{color:PRINT_COLORS.grid}} } }
  });

  const acwrTone = toneForACWR(teamMetricsWeek.acwr);
  const wellTone = toneForWellness(avgScoreWeek);
  const acwrColor = PRINT_TONE_HEX[acwrTone.tone] || PRINT_COLORS.text;
  const wellColor = PRINT_TONE_HEX[wellTone.tone] || PRINT_COLORS.text;
  const respColor = avgResponseRate>=80? PRINT_TONE_HEX.success : (avgResponseRate>=50? PRINT_TONE_HEX.warning : PRINT_TONE_HEX.danger);

  /* --- Construction du HTML imprimable --- */
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Bilan de la semaine — ${fmtDate(weekStart)} au ${fmtDate(weekEnd)}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;}
    body{font-family:'Inter',Arial,sans-serif;color:#232830;margin:0;background:#f7f7f8;}
    .sheet{max-width:900px;margin:0 auto;background:#fff;}
    .masthead{background:linear-gradient(120deg,#12161c,#1c232d);padding:26px 40px;display:flex;align-items:center;gap:16px;}
    .masthead img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(232,102,28,.5));}
    .masthead h1{font-family:'Barlow Condensed',sans-serif;color:#fff;font-size:28px;font-weight:800;margin:0;letter-spacing:.3px;}
    .masthead .meta{color:#b9c0cc;font-size:13px;margin-top:3px;}
    .masthead .accent{color:#ff8a54;font-weight:700;}
    .body-pad{padding:28px 40px 40px 40px;}
    h2{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:.3px;margin:30px 0 12px 0;padding-left:12px;border-left:5px solid #E8661C;color:#181c22;text-transform:uppercase;}
    .kpis{display:flex;gap:14px;margin:6px 0 8px 0;flex-wrap:wrap;}
    .kpi-box{flex:1;min-width:150px;border:1px solid #e8e8e8;border-radius:12px;padding:14px 16px;box-shadow:0 2px 6px rgba(0,0,0,.04);}
    .kpi-box .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#8a8f98;margin-bottom:6px;font-weight:600;}
    .kpi-box .val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;line-height:1;}
    table{width:100%;border-collapse:collapse;margin-top:6px;border-radius:10px;overflow:hidden;}
    th{background:#181c22;color:#fff;text-transform:uppercase;font-size:10px;letter-spacing:.05em;font-weight:600;padding:9px 10px;text-align:left;}
    td{padding:8px 10px;font-size:12.5px;border-bottom:1px solid #eee;}
    tbody tr:nth-child(even){background:#faf9f7;}
    .notes{background:#fff6ee;border-left:4px solid #E8661C;border-radius:8px;padding:14px 18px;font-size:13.5px;white-space:pre-wrap;margin-top:6px;line-height:1.5;}
    .chart-card{border:1px solid #eee;border-radius:12px;padding:16px 18px 6px 18px;margin-top:6px;box-shadow:0 2px 6px rgba(0,0,0,.04);}
    img.chart{width:100%;max-width:760px;display:block;}
    .footer{margin-top:36px;padding:18px 40px;background:#181c22;color:#9aa2ad;font-size:11px;text-align:center;letter-spacing:.03em;}
    .footer b{color:#ff8a54;}
    @media print{ body{background:#fff;} .kpi-box,.chart-card{box-shadow:none;} .masthead{-webkit-print-color-adjust:exact;print-color-adjust:exact;} th{-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
  </style></head><body>
  <div class="sheet">
    <div class="masthead">
      <img src="${LOGO_ICON_B64}" alt="Fab'Lab">
      <div>
        <h1>BILAN DE LA SEMAINE</h1>
        <div class="meta"><span class="accent">${escapeHtml(groupLabel)}</span> · Semaine du ${fmtDate(weekStart)} au ${fmtDate(weekEnd)} · Généré le ${fmtDate(todayISO())}</div>
      </div>
    </div>
    <div class="body-pad">

    ${notes.trim()? `<h2>Notes de la semaine</h2><div class="notes">${escapeHtml(notes)}</div>` : ''}

    <h2>Vue d'ensemble</h2>
    <div class="kpis">
      <div class="kpi-box"><div class="lbl">Séances effectuées</div><div class="val">${sessionGroups.length}</div></div>
      <div class="kpi-box"><div class="lbl">ACWR moyen équipe</div><div class="val" style="color:${acwrColor};">${teamMetricsWeek.acwr!=null?round1(teamMetricsWeek.acwr):'—'}</div></div>
      <div class="kpi-box"><div class="lbl">Wellness moyen</div><div class="val" style="color:${wellColor};">${avgScoreWeek!=null?round0(avgScoreWeek):'—'}<span style="font-size:15px;">/100</span></div></div>
      <div class="kpi-box"><div class="lbl">Taux de réponse wellness</div><div class="val" style="color:${respColor};">${round0(avgResponseRate)}<span style="font-size:15px;">%</span></div></div>
    </div>

    <h2>Résumé des séances (thème / sous-thème)</h2>
    ${sessionGroups.length? `<table><thead><tr><th>Date</th><th>Séance</th><th>Thème</th><th>Sous-thème</th><th>Durée</th><th>RPE coach</th><th>RPE joueurs (moy.)</th><th>Réponses</th></tr></thead><tbody>
      ${sessionGroups.map(g=>{
        const sess = state.sessions.find(s=>s.id===g.sessionId);
        const withRPE = g.entries.filter(e=>e.playerRPE!=null);
        const avgPRPE = withRPE.length? round1(mean(withRPE.map(e=>e.playerRPE))) : '—';
        return `<tr><td>${fmtDate(g.date)}</td><td><b>${escapeHtml(g.sessionName||g.sessionCode||'Séance libre')}</b></td><td>${escapeHtml(sess?.dominant||g.sessionType||'—')}</td><td>${escapeHtml(sess?.subDominant||'—')}</td><td>${g.duration||'—'} min</td><td>${g.coachRPE??'—'}</td><td>${avgPRPE}</td><td>${withRPE.length}/${g.entries.length}</td></tr>`;
      }).join('')}
    </tbody></table>` : `<p class="meta" style="color:#888;">Aucune séance enregistrée sur cette semaine pour ce périmètre.</p>`}

    <h2>Analyse de la charge</h2>
    <div class="chart-card"><img class="chart" src="${chargeChartImg}" alt="Charge moyenne quotidienne de l'équipe"></div>

    <h2>Analyse wellness</h2>
    <div class="chart-card"><img class="chart" src="${wellnessChartImg}" alt="Wellness moyen quotidien"></div>

    ${rpeChartImg? `<h2>Comparatif RPE coach vs RPE joueurs</h2><div class="chart-card"><img class="chart" src="${rpeChartImg}" alt="RPE coach vs RPE joueurs"></div>` : ''}

    </div>
    <div class="footer"><b>FAB'LAB</b> — Pôle PACA Handball · Bilan généré automatiquement</div>
  </div>
  <script>
    window.onload = function(){ setTimeout(function(){ window.print(); }, 250); };
  <\/script>
  </body></html>`;

  const win = window.open('', '_blank');
  if(!win){ showToast("Le navigateur a bloqué l'ouverture du bilan — autorisez les pop-ups pour ce site puis réessayez."); return; }
  win.document.write(html);
  win.document.close();
}

          return `<tr data-id="${p.id}">
            <td><b>${escapeHtml(playerName(p))}</b></td>
            <td>${escapeHtml(p.group||'—')}</td>
            <td>${escapeHtml(p.position||'—')}</td>

            <td style="text-align:right;white-space:nowrap;">
              <button class="icon-btn" title="Fiche" data-act="view">👁</button>

        }).join('')}

        `<div class="empty-state"><h4>Aucun joueur</h4><p>Ajoutez votre premier joueur pour démarrer le suivi.</p></div>`}

  `;

  el.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{ state.ui.effectifStatusFilter = c.dataset.status; renderEffectif(); }));
  el.querySelector('#btn-add-player').addEventListener('click', ()=>openPlayerForm());

        <select id="fiche-player-sel" style="min-width:220px;">${playerOptionsHtml(state.ui.selectedPlayerId, state.ui.groupFilter)}</select>
      </div>
    </div>
    <div id="fiche-body"></div>
  `;
  const groupSel = document.getElementById('fiche-group-sel');
  const playerSel = document.getElementById('fiche-player-sel');
  groupSel.value = state.ui.groupFilter;
  groupSel.onchange = ()=>{ state.ui.groupFilter = groupSel.value; playerSel.innerHTML = playerOptionsHtml(null, state.ui.groupFilter); };
  playerSel.onchange = ()=>{ state.ui.selectedPlayerId = playerSel.value; renderFicheBody(); };

  renderFicheBody();
}

          </div>
          <div>
            <div class="eyebrow" style="display:flex;align-items:center;gap:6px;">
              Taille adulte prévisionnelle
              ${predHeight?.both? `<button type="button" id="btn-toggle-height-detail" class="icon-btn" style="padding:1px;font-size:14px;" title="Voir le détail des 2 méthodes">👁</button>` : ''}

                ${predHeight.results.map(r=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span class="help-text">${escapeHtml(r.label)}</span><b class="mono">${r.height} cm</b></div>`).join('')}

function renderMeasurementHistoryHtml(playerId){
  const list = playerMeasurements(playerId);
  if(!list.length){ return `<p class="help-text">Aucune mesure enregistrée pour l'instant — la fiche affiche les champs actuels comme point de départ.</p>`; }
  const metrics = [
    {key:'height', label:'Taille', unit:'cm'}, {key:'weight', label:'Poids', unit:'kg'},
    {key:'wingspan', label:'Envergure', unit:'cm'}, {key:'sittingHeight', label:'Taille assise', unit:'cm'},
    {key:'bodyFat', label:'Masse grasse', unit:'%'}, {key:'leanMass', label:'Masse musculaire', unit:'%'},
  ];
  const first = list[0], last = list[list.length-1];
  const progressionRow = list.length>1 ? `
    <div class="grid grid-3" style="margin-bottom:14px;">
      ${metrics.filter(m=>first[m.key]!=null && last[m.key]!=null).map(m=>{
        const pct = pctChange(first[m.key], last[m.key]);
        const tone = pct==null? 'muted' : (pct>0? 'success':(pct<0?'danger':'muted'));
        return `<div>
          <div class="eyebrow">${m.label} — évolution</div>
          <div>${pill((pct>0?'+':'')+pct+'%', tone)} <span class="help-text">depuis le ${fmtDate(first.date)}</span></div>
        </div>`;
      }).join('')}
    </div>` : `<p class="help-text" style="margin-bottom:14px;">Une seule mesure enregistrée pour l'instant — la progression apparaîtra dès la prochaine.</p>`;

  const table = `<div class="table-wrap"><table><thead><tr><th>Date</th>${metrics.map(m=>`<th>${m.label}</th>`).join('')}<th></th></tr></thead><tbody>
    ${[...list].reverse().map(rec=>`<tr data-id="${rec.id}">
      <td>${fmtDate(rec.date)}</td>
      ${metrics.map(m=>`<td class="mono">${rec[m.key]!=null? rec[m.key]+' '+m.unit : '—'}</td>`).join('')}
      <td style="text-align:right;"><button class="icon-btn btn-danger" data-act="del-measurement" data-id="${rec.id}" title="Supprimer cette mesure">🗑</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;

  setTimeout(()=>{
    document.querySelectorAll('[data-act="del-measurement"]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirmDialog('Supprimer cette mesure de l\'historique ?')) return;
        state.measurements = state.measurements.filter(m=>m.id!==btn.dataset.id);
        await persist('measurements');
        // Si on supprime la plus récente, on resynchronise la fiche joueur avec la nouvelle plus récente.
        const p = playerById(playerId);
        const newest = latestMeasurement(playerId);
        if(p && newest){ ['height','weight','wingspan','sittingHeight','bodyFat','leanMass'].forEach(k=>{ p[k]=newest[k]; }); await persist('players'); }
        renderFicheBody();
        setTimeout(()=>{
          const box = document.getElementById('mens-history');
          if(box){ box.style.display='block'; box.innerHTML = renderMeasurementHistoryHtml(playerId); }
        }, 30);
      });
    });
  }, 0);

  return progressionRow + table;
}

    submitLabel: 'Enregistrer cette mesure',
    wide:true,
    bodyHtml: `
      <div class="field"><label>Date de la mesure</label><input type="date" name="date" value="${todayISO()}"></div>
      <div class="field-row3">
        <div class="field"><label>Taille (cm)</label><input type="number" step="0.1" name="height" value="${p.height??''}"></div>
        <div class="field"><label>Poids (kg)</label><input type="number" step="0.1" name="weight" value="${p.weight??''}"></div>
        <div class="field"><label>Envergure (cm)</label><input type="number" step="0.1" name="wingspan" value="${p.wingspan??''}"></div>
      </div>
      <div class="field-row3">
        <div class="field"><label>Taille assise (cm)</label><input type="number" step="0.1" name="sittingHeight" value="${p.sittingHeight??''}"></div>
        <div class="field"><label>Masse grasse (%)</label><input type="number" step="0.1" name="bodyFat" value="${p.bodyFat??''}"></div>
        <div class="field"><label>Masse musculaire (%)</label><input type="number" step="0.1" name="leanMass" value="${p.leanMass??''}"></div>
      </div>
      <p class="help-text">La taille assise est la mesure du haut du corps (assis, du siège au sommet du crâne). C'est elle qui permet un calcul précis du PVC (formule de Mirwald 2002) — sans elle, une estimation simplifiée moins précise est utilisée.</p>
      <p class="help-text">Chaque enregistrement s'ajoute à l'historique du joueur (une mesure par saisie) — pratique pour suivre plusieurs prises dans l'année. La fiche athlète affiche toujours la plus récente.</p>
      <div class="divider"></div>
      <div class="field"><label>Sexe (pour le calcul du PVC)</label><select name="sex"><option value="M" ${p.sex!=='F'?'selected':''}>Garçon</option><option value="F" ${p.sex==='F'?'selected':''}>Fille</option></select></div>
      <div class="field-row">
        <div class="field"><label>Taille du père (cm)</label><input type="number" step="0.1" name="fatherHeight" value="${p.fatherHeight??''}"></div>
        <div class="field"><label>Taille de la mère (cm)</label><input type="number" step="0.1" name="motherHeight" value="${p.motherHeight??''}"></div>
      </div>
      <p class="help-text">Sexe et taille des parents ne changent pas dans le temps — ces 3 champs mettent juste à jour la fiche, sans créer de nouvelle mesure.</p>
    `,
    onSubmit: async (fd, close)=>{
      p.sex = fd.get('sex');
      ['fatherHeight','motherHeight'].forEach(k=>{ const v=fd.get(k); p[k] = v===''? null : Number(v); });
      const data = {};
      ['height','weight','wingspan','sittingHeight','bodyFat','leanMass'].forEach(k=>{
        const v = fd.get(k);
        data[k] = v===''? null : Number(v);
      });
      await addMeasurement(p, { date: fd.get('date')||todayISO(), ...data });
      close();
      renderFicheBody();
      showToast('Mensurations enregistrées.');
    }
  });
}

function renderInjuriesList(playerId){
  const target = document.getElementById('fiche-injuries-list');
  if(!target) return;
  const list = playerInjuries(playerId);
  if(!list.length){ target.innerHTML = `<p class="help-text">Aucune blessure enregistrée pour ce joueur.</p>`; return; }
  const player = playerById(playerId);
  target.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Zone</th><th>Grade</th><th>Statut</th><th>Examen</th><th>Note</th><th></th></tr></thead><tbody>
    ${list.map(i=>{
      const grade = injuryGradeInfo(i.grade);
      const isActive = player && player.activeInjuryId===i.id && isInjuryStillActive(player);
      return `<tr data-id="${i.id}">
        <td>${fmtDate(i.date)}</td>
        <td>${escapeHtml(i.type||'—')}</td>
        <td>${escapeHtml(BODY_ZONE_LABEL[i.zone]||i.zone)}</td>
        <td>${pill(grade.label, grade.tone)}</td>
        <td>${isActive? pill('Active','danger') : pill('Archivée','muted')}</td>
        <td>${escapeHtml(i.examType||'—')}</td>
        <td class="help-text">${escapeHtml(i.note||'—')}</td>
        <td style="text-align:right;white-space:nowrap;"><button class="icon-btn" data-act="edit-injury" title="Modifier">✎</button><button class="icon-btn btn-danger" data-act="del-injury" title="Supprimer">🗑</button></td>
      </tr>`;
    }).join('')}
  </tbody></table></div>`;
  target.querySelectorAll('[data-act="edit-injury"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tr = btn.closest('tr'); const id = tr.dataset.id;
      openInjuryForm(playerId, state.injuries.find(i=>i.id===id));
    });
  });
  target.querySelectorAll('[data-act="del-injury"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tr = btn.closest('tr'); const id = tr.dataset.id;
      if(!confirmDialog('Supprimer cette blessure de l\'historique ?')) return;
      state.injuries = state.injuries.filter(i=>i.id!==id);
      await persist('injuries');
      // Si c'était la blessure active du joueur, tout redevient automatique : statut, dispo, date de retour.
      const player = playerById(playerId);
      if(player && player.activeInjuryId===id){
        player.injuryState = 'none';
        player.returnDate = '';
        player.activeInjuryId = null;
        await persist('players');
        refreshGroupFilterSelect();
      }
      renderFicheBody();
    });
  });
}

function openInjuryForm(playerId, existing){
  const rec = existing || {id:uid('inj'), playerId, date:todayISO(), zone:BODY_ZONES[0].id, grade:'grade1', type:INJURY_TYPES[0], examType:'', note:''};
  const player = playerById(playerId);
  const wasActive = player && player.activeInjuryId===rec.id;
  openModal({
    title: existing? 'Modifier la blessure' : 'Ajouter une blessure à l\'historique',
    submitLabel: existing? 'Enregistrer' : 'Ajouter',
    extraFootHtml: existing? `<button type="button" class="btn btn-ghost btn-danger btn-sm" id="btn-del-injury-modal">Supprimer</button>` : '',
    bodyHtml:`
      <div class="field-row3">
        <div class="field"><label>Date</label><input type="date" name="date" id="inj-date" value="${rec.date}"></div>
        <div class="field"><label>Type de blessure</label><select name="type" id="inj-type">${INJURY_TYPES.map(t=>`<option ${t===rec.type?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="field"><label>Grade</label><select name="grade" id="inj-grade">${INJURY_GRADES.map(g=>`<option value="${g.id}" ${g.id===rec.grade?'selected':''}>${g.label}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Zone</label><select name="zone" id="inj-zone">
        <optgroup label="Face">${BODY_ZONES.filter(z=>z.view==='front').map(z=>`<option value="${z.id}" ${z.id===rec.zone?'selected':''}>${z.label}</option>`).join('')}</optgroup>
        <optgroup label="Dos">${BODY_ZONES.filter(z=>z.view==='back').map(z=>`<option value="${z.id}" ${z.id===rec.zone?'selected':''}>${z.label}</option>`).join('')}</optgroup>
      </select></div>
      <div class="field"><label>Type d'examen</label><input name="examType" value="${escapeHtml(rec.examType||'')}" placeholder="ex : IRM, radio, écho, scanner…"></div>
      <div class="field"><label>Note</label><textarea name="note" placeholder="Détails complémentaires…">${escapeHtml(rec.note||'')}</textarea></div>
      <div class="divider"></div>
      <div class="card" style="background:var(--surface-raised);padding:12px 14px;">
        <div class="eyebrow" style="margin-bottom:4px;">Estimation de retour (littérature sportive)</div>
        <div id="inj-estimate" style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;"></div>
        <p class="help-text" style="margin-top:4px;">Ordre de grandeur indicatif, pas un avis médical — à ajuster selon le suivi kiné/médical réel.</p>
        <label style="display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;margin-top:8px;">
          <input type="checkbox" name="applyToPlayer" ${(!existing || wasActive)?'checked':''} style="width:auto;">
          Appliquer au joueur : passer en « Blessé », régler la date de retour prévue, et mettre à jour la disponibilité automatiquement
        </label>
      </div>
    `,
    onMount: ()=>{
      const update = ()=>{
        const zone = document.getElementById('inj-zone').value;
        const grade = document.getElementById('inj-grade').value;
        const type = document.getElementById('inj-type').value;
        const date = document.getElementById('inj-date').value || todayISO();
        const est = estimateRehabWeeks(type, zone, grade);
        const returnDate = addDays(date, est.weeks*7);
        document.getElementById('inj-estimate').textContent = `${est.weeks} semaine(s) — retour estimé le ${fmtDate(returnDate)}`;
      };
      ['inj-zone','inj-grade','inj-type','inj-date'].forEach(id=>document.getElementById(id).addEventListener('change', update));
      update();
      if(existing){
        const delBtn = document.getElementById('btn-del-injury-modal');
        if(delBtn) delBtn.onclick = ()=>{
          if(!confirmDialog('Supprimer cette blessure de l\'historique ?')) return;
          state.injuries = state.injuries.filter(i=>i.id!==rec.id);
          persist('injuries');
          if(player && player.activeInjuryId===rec.id){
            player.injuryState='none'; player.returnDate=''; player.activeInjuryId=null;
            persist('players'); refreshGroupFilterSelect();
          }
          document.getElementById('modal-backdrop').remove();
          renderFicheBody();
        };
      }
    },
    onSubmit: async (fd, close)=>{
      const upd = {...rec};
      ['date','zone','grade','type','examType','note'].forEach(k=>upd[k]=fd.get(k));
      const idx = state.injuries.findIndex(i=>i.id===upd.id);
      if(idx>=0) state.injuries[idx]=upd; else state.injuries.push(upd);
      await persist('injuries');
      if(fd.get('applyToPlayer')==='on' && player){
        const est = estimateRehabWeeks(upd.type, upd.zone, upd.grade);
        player.injuryState = 'blesse';
        player.returnDate = addDays(upd.date, est.weeks*7);
        player.activeInjuryId = upd.id;
        await persist('players');
      } else if(existing && wasActive && fd.get('applyToPlayer')!=='on' && player){
        // On a décoché "appliquer" alors que c'était la blessure active : on libère le joueur.
        player.injuryState='none'; player.returnDate=''; player.activeInjuryId=null;
        await persist('players');
      }
      close();
      renderFicheBody();
      showToast(existing? 'Blessure mise à jour.' : 'Blessure ajoutée à l\'historique.');
    }
  });
}

    ${list.map(w=>{

      return `<tr data-id="${w.id}"><td>${fmtDate(w.date)}</td><td>${escapeHtml(playerName(pl))}</td><td>${pill(score,tone.tone)}</td><td>${w.painZone? escapeHtml(BODY_ZONES.find(z=>z.id===w.painZone)?.label||w.painZone)+' ('+w.pain+'/10)':'—'}</td><td style="text-align:right;"><button class="icon-btn btn-danger" data-act="del-wellness" title="Supprimer cette saisie">🗑</button></td></tr>`;
    }).join('')}
  </tbody></table></div>
  ${all.length>12? `<button type="button" class="btn btn-ghost btn-sm" id="btn-toggle-wl-history" style="margin-top:12px;">${wellnessHistoryExpanded? '👁 Voir moins (12 plus récentes)' : `👁 Voir l'historique complet (${all.length})`}</button>` : ''}`;
  target.querySelectorAll('[data-act="del-wellness"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tr = btn.closest('tr'); const id = tr.dataset.id;
      if(!confirmDialog('Supprimer cette saisie wellness ?')) return;
      state.wellness = state.wellness.filter(w=>w.id!==id);
      await persist('wellness');
      renderWellnessHistory();
      showToast('Saisie supprimée.');
    });
  });
  const toggleBtn = document.getElementById('btn-toggle-wl-history');
  if(toggleBtn) toggleBtn.onclick = ()=>{ wellnessHistoryExpanded = !wellnessHistoryExpanded; renderWellnessHistory(); };
}

const DEFAULT_REMINDER_MESSAGE = "N'oublie pas de remplir ton wellness du jour avant l'entraînement, ça prend 30 secondes 👇";

          <select data-el="private-player">${playerOptionsHtml(null, null)}</select>
        </div>
        <div class="field"><label>Message</label><textarea data-el="private-message" placeholder="Écrivez votre message…"></textarea></div>
        <p class="help-text">Ce joueur reçoit aussi automatiquement son lien direct vers sa page wellness.</p>
        <button class="btn btn-accent" data-act="private-send">Envoyer le message privé</button>
      </div>

      <div data-el="compose-box" style="display:none;margin-top:16px;">
        <div class="divider"></div>
        <div class="field"><label>Destinataires</label>
          <select data-el="compose-scope">
            <option value="all">Tout le groupe affiché (${scope.length})</option>
            <option value="missing" ${notResponded.length? 'selected':''}>Uniquement les non-répondants (${notResponded.length})</option>
          </select>

    sendWellnessReminderBulk(targets, e.target, msg);
  };
}

// Envoi d'email via notre fonction Netlify (qui appelle Brevo côté serveur, clé jamais exposée).
async function sendEmailViaServer(params){
  const resp = await fetch('/.netlify/functions/send-email', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(params),
  });
  const data = await resp.json().catch(()=>({}));
  if(!resp.ok || !data.success){ throw new Error(data.error || 'Échec de l\'envoi'); }
  return data;
}

async function sendWellnessReminder(player, btnEl, message){
  if(!player || !player.email){ showToast('Aucun email renseigné pour ce joueur.'); return; }
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = '…'; }
  try{
    await sendEmailViaServer({
      to_email: player.email,
      to_name: playerName(player),
      from_name: "Fab'Lab — Pôle PACA Handball",
      message: (message || DEFAULT_REMINDER_MESSAGE) + '\n\n' + kioskLink(player),
    });
    showToast('Message envoyé à '+playerName(player)+'.');
    if(btnEl){ btnEl.textContent = '✓'; }
  }catch(e){
    console.error(e);
    showToast("Échec de l'envoi à "+playerName(player)+' — '+e.message);
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = '✉'; }
  }
}

async function sendWellnessReminderBulk(players, btnEl, message){
  const withEmail = players.filter(p=>p.email);
  const withoutEmail = players.length - withEmail.length;
  if(!withEmail.length){ showToast('Aucun email renseigné parmi les destinataires sélectionnés.'); return; }
  if(!confirmDialog(`Envoyer ce message par email à ${withEmail.length} joueur(s) ?`+(withoutEmail? ` (${withoutEmail} sans email, ignoré(s))`:''))) return;
  const originalLabel = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'Envoi en cours…'; }
  let ok = 0, fail = 0;
  for(const p of withEmail){
    try{
      await sendEmailViaServer({
        to_email: p.email, to_name: playerName(p), from_name: "Fab'Lab — Pôle PACA Handball",
        message: (message || DEFAULT_REMINDER_MESSAGE) + '\n\n' + kioskLink(p),
      });
      ok++;
    }catch(e){ console.error(e); fail++; }
  }
  showToast(`${ok} message(s) envoyé(s)`+(fail?`, ${fail} échec(s)`:''));
  if(btnEl){ btnEl.disabled = false; btnEl.textContent = originalLabel; }
  renderWellnessTodayStatus();
}

let expandedSessionKeys = new Set();

function groupLoadsBySession(list){
  const groups = {};
  list.forEach(l=>{
    const key = l.sessionId ? `${l.date}__${l.sessionId}__${l.group}` : `ind__${l.id}`;
    if(!groups[key]){
      groups[key] = { key, date:l.date, group:l.group, sessionId:l.sessionId,
        sessionName:l.sessionName, sessionCode:l.sessionCode, sessionType:l.sessionType,
        coachRPE:(l.coachRPE ?? l.rpe ?? null), duration:l.duration, entries:[] };
    }
    groups[key].entries.push(l);
  });
  return Object.values(groups).sort((a,b)=> b.date.localeCompare(a.date));
}

          const open = expandedSessionKeys.has(g.key);
          return `<tr class="session-row" data-key="${g.key}" style="cursor:pointer;">
            <td class="mono" style="color:var(--text-muted);">${open?'▾':'▸'}</td>
            <td>${fmtDate(g.date)}</td>
            <td><b>${escapeHtml(g.sessionName||g.sessionCode||g.sessionType||'Séance libre')}</b></td>
            <td>${escapeHtml(g.group||'—')}</td>
            <td class="mono">${n}</td>
            <td class="mono">${g.coachRPE??'—'}</td>
            <td>
              <div style="display:flex;align-items:center;gap:8px;">
                <div class="bar-track" style="width:70px;"><div class="bar-fill" style="width:${n?responded/n*100:0}%;background:${responded===n?TONE_HEX.success:TONE_HEX.warning};"></div></div>
                <span class="mono" style="font-size:12px;">${responded}/${n}</span>
              </div>
            </td>
            <td><span class="tag tag-auto mono" style="font-size:12px;padding:4px 8px;">${round0(avgLoad)}</span></td>
            <td style="text-align:right;white-space:nowrap;">
              <button class="icon-btn btn-danger" data-act="del-session" data-key="${g.key}" title="Supprimer toute la séance">🗑</button>
            </td>

          ${open? `<tr class="session-detail-row" data-detail-for="${g.key}"><td colspan="9" style="padding:0;background:var(--bg-void-2);">
            <div class="table-wrap" style="padding:6px 16px;">
            <table><thead><tr><th>Joueur</th><th>RPE joueur</th><th>Charge</th><th>Participation</th><th></th></tr></thead><tbody>
            ${g.entries.map(en=>{
              const p = playerById(en.playerId); const load = (Number(en.duration)||0)*effectiveRPE(en);
              return `<tr data-id="${en.id}">
                <td>${escapeHtml(playerName(p))}</td>
                <td><input type="number" min="1" max="10" placeholder="—" value="${en.playerRPE??''}" data-rpe-input="${en.id}" style="width:64px;"></td>

  el.querySelectorAll('[data-act="edit"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openLoadForm(state.loads.find(l=>l.id===btn.dataset.id)); });

  el.querySelectorAll('[data-act="del"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirmDialog('Supprimer cette entrée ?')){ state.loads = state.loads.filter(x=>x.id!==btn.dataset.id); persist('loads'); renderCharge(); }
    });
  });
  el.querySelectorAll('[data-rpe-input]').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('change', async ()=>{
      const entry = state.loads.find(x=>x.id===inp.dataset.rpeInput);
      if(!entry) return;
