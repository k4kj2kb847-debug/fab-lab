      showToast('RPE enregistré.');
      renderCharge();
    });
  });
}

/* --- Séance de groupe créée depuis la bibliothèque : génère une entrée de charge pour chaque joueur du groupe --- */
function openGroupSessionForm(){
  const defaultGroup = state.ui.groupFilter!=='__all__' ? state.ui.groupFilter : (state.settings.groups[0]||'');
  openModal({
    title: 'Nouvelle séance de groupe (depuis la bibliothèque)',
    submitLabel: 'Créer pour tout le groupe',
    bodyHtml: `
      ${!state.sessions.length? `<p class="help-text">Aucune séance dans la bibliothèque — créez-en une dans l'onglet Bibliothèque de séances, ou utilisez « Séance individuelle ».</p>` : `
      <div class="field"><label>Séance</label><select id="gs-session" name="sessionId">
        ${Object.entries(DOMINANTS.reduce((acc,d)=>{acc[d]=state.sessions.filter(s=>s.dominant===d); return acc;},{})).filter(([,arr])=>arr.length).map(([dom,arr])=>`
          <optgroup label="${dom}">${arr.map(s=>`<option value="${s.id}">${escapeHtml(s.name)} (${escapeHtml(s.code)})</option>`).join('')}</optgroup>
        `).join('')}
      </select></div>
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" name="date" value="${todayISO()}"></div>
        <div class="field"><label>Groupe concerné</label><select name="group" id="gs-group">${groupOptionsHtml(defaultGroup,false)}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Durée (min)</label><input type="number" name="duration" id="gs-duration" min="0"></div>
        <div class="field"><label>RPE coach (intensité prescrite, 1-10)</label><input type="number" name="coachRPE" id="gs-rpe" min="1" max="10"></div>
      </div>
      <p class="help-text" id="gs-count"></p>
      <p class="help-text">Chaque joueur du groupe recevra une entrée de charge avec ce RPE coach. Le RPE joueur (ressenti réel) viendra ensuite compléter/remplacer le calcul dès qu'il sera renseigné.</p>
      `}
    `,
    onMount: ()=>{
      if(!state.sessions.length) return;
      const sessSel = document.getElementById('gs-session');
      const groupSel = document.getElementById('gs-group');
      const durationInp = document.getElementById('gs-duration');
      const rpeInp = document.getElementById('gs-rpe');
      const countEl = document.getElementById('gs-count');
      const applySessionDefaults = ()=>{
        const sess = state.sessions.find(s=>s.id===sessSel.value);
        if(sess){ durationInp.value = sess.duration||''; rpeInp.value = sess.rpeTarget||''; }
      };
      const updateCount = ()=>{
        const n = state.players.filter(p=>p.group===groupSel.value).length;
        countEl.textContent = n+ ' joueur(s) dans ce groupe recevront cette séance.';
      };
      sessSel.onchange = applySessionDefaults;
      groupSel.onchange = updateCount;
      applySessionDefaults(); updateCount();
    },
    onSubmit: async (fd, close)=>{
      if(!state.sessions.length){ close(); return; }
      const sessionId = fd.get('sessionId');
      const session = state.sessions.find(s=>s.id===sessionId);
      const date = fd.get('date') || todayISO();
      const group = fd.get('group');
      const duration = Number(fd.get('duration'))||0;
      const coachRPE = Number(fd.get('coachRPE'))||0;
      const targets = state.players.filter(p=>p.group===group);
      if(!targets.length){ showToast('Aucun joueur dans ce groupe.'); return; }
      let created = 0, skipped = 0;
      targets.forEach(p=>{
        const dup = state.loads.some(l=>l.playerId===p.id && l.date===date && l.sessionId===sessionId);
        if(dup){ skipped++; return; }
        state.loads.push({
          id: uid('ld'), date, group, playerId: p.id,
          sessionId, sessionCode: session?.code||'', sessionName: session?.name||'', sessionType: session?.dominant||'',
          duration, coachRPE, rpe: coachRPE, playerRPE: null,
          available:'oui', participation:'Complète', painReported:false, comment:''
        });
        created++;
      });
      await persist('loads');

      // Ajoute aussi automatiquement cette séance au planning hebdomadaire (évite la double saisie).
      const alreadyPlanned = state.planning.some(pl=>pl.kind!=='annual' && pl.date===date && pl.group===group && pl.sessionId===sessionId);
      if(!alreadyPlanned && created>0){
        state.planning.push({
          id: uid('pw'), kind:'weekly', date, group, sessionId,
          sessionName: session?.name||'', slot:'', objective: session?.objective||'', dominant: session?.dominant||'',
          intensity: intensityFromRPE(coachRPE), duration, location:'', responsible:'', remark:''
        });
        await persist('planning');
      }

      close(); renderCharge();
      showToast(`${created} joueur(s) ajouté(s)`+(skipped?`, ${skipped} déjà existant(s) ignoré(s)`:'')+' — ajouté au planning.');
    }
  });
}

        <div class="field"><label>Disponible</label><select name="available"><option value="oui" ${l.available==='oui'?'selected':''}>Oui</option><option value="non" ${l.available==='non'?'selected':''}>Non</option></select></div>
        <div class="field"><label>Participation</label><select name="participation">${['Complète','Partielle','Absente'].map(x=>`<option ${x===l.participation?'selected':''}>${x}</option>`).join('')}</select></div>

      <div class="field"><label>Commentaire staff</label><textarea name="comment">${escapeHtml(l.comment||'')}</textarea></div>
    `,
    onMount: ()=>{
      const gsel = document.getElementById('ld-group'), psel = document.getElementById('ld-player');
      gsel.onchange = ()=>{ psel.innerHTML = playerOptionsHtml(null, gsel.value); };
      const durEl = document.getElementById('ld-duration'), coachEl = document.getElementById('ld-coachrpe'), playerEl = document.getElementById('ld-playerrpe');
      const updatePreview = ()=>{
        const d = Number(durEl.value)||0;
        const r = playerEl.value? Number(playerEl.value) : (Number(coachEl.value)||0);
        document.getElementById('ld-load-preview').value = d*r;
      };
      [durEl, coachEl, playerEl].forEach(elm=>elm.addEventListener('input', updatePreview));
      updatePreview();
      document.getElementById('ld-session').onchange = (e)=>{
        const sess = state.sessions.find(s=>s.id===e.target.value);
        if(sess){
          document.getElementById('ld-sessionname').value = sess.name||'';
          if(sess.duration) durEl.value = sess.duration;
          if(sess.rpeTarget) coachEl.value = sess.rpeTarget;
          updatePreview();
        }
      };
    },
    onSubmit: async (fd, close)=>{
      const upd = {...l};
      ['date','group','playerId','sessionType','sessionName','duration','coachRPE','playerRPE','available','participation','comment'].forEach(k=>upd[k]=fd.get(k));
      upd.duration = Number(upd.duration)||0;
      upd.coachRPE = upd.coachRPE!==''? Number(upd.coachRPE) : null;
      upd.playerRPE = upd.playerRPE!==''? Number(upd.playerRPE) : null;
      upd.rpe = upd.coachRPE; // compatibilité avec l'ancien champ générique
      upd.sessionId = document.getElementById('ld-session').value || null;
      if(upd.sessionId){ const sess = state.sessions.find(s=>s.id===upd.sessionId); if(sess) upd.sessionCode = sess.code; }
      upd.painReported = fd.get('painReported')==='on';
      if(!upd.playerId){ showToast('Sélectionnez un joueur.'); return; }
      const idx = state.loads.findIndex(x=>x.id===l.id);
      if(idx>=0) state.loads[idx]=upd; else state.loads.push(upd);
      await persist('loads'); close(); renderCharge();
      showToast('Séance enregistrée — charge '+(upd.duration*effectiveRPE(upd)));
    }
  });
}

function weeklyMetricTrend(playerId, weeks=8){
  const out = [];
  for(let i=weeks-1;i>=0;i--){
    const endIso = addDays(todayISO(), -i*7);
    const m = loadMetrics(playerId, endIso);
    out.push({ endIso, ...m });
  }
  return out;
}

      <div class="panel-actions">

        Ce choix (moyenne plutôt que somme brute) lisse les jours sans donnée et suit la méthode « rolling average » désormais privilégiée en pratique, plus stable que la somme glissante historique.
        <b>ACWR</b> = charge aiguë / charge chronique. <b>Monotonie</b> = moyenne des charges quotidiennes de la semaine / écart-type de ces charges. <b>Strain</b> = charge hebdomadaire totale × monotonie.

/* --- Vue équipe : tendances agrégées + tableau comparatif complet --- */
function teamMetricTrend(weeks=8){
  const out = [];
  const scope = playersInScope();
  for(let i=weeks-1;i>=0;i--){
    const endIso = addDays(todayISO(), -i*7);
    const metrics = scope.map(p=>loadMetrics(p.id, endIso));
    const acwrs = metrics.map(m=>m.acwr).filter(v=>v!=null);
    const monos = metrics.map(m=>m.monotony).filter(v=>v!=null);
    out.push({
      endIso,
      acwr: acwrs.length? mean(acwrs) : null,
      monotony: monos.length? mean(monos) : null,
      weeklyLoad: mean(metrics.map(m=>m.weeklyLoad)),
    });
  }
  return out;
}

      <p class="help-text">${crossMode? 'Chaque point est un joueur, positionné selon ses deux derniers résultats.' : 'Tous les joueurs classés sur ce test, reliés par ordre de classement.'}</p>
    </div>
    <div class="card">
      <div class="card-title"><h3>Vue d'ensemble — dernière valeur par test et par joueur</h3>${tagAuto()}</div>
      <div class="chips" id="te-matrix-cat" style="margin-bottom:12px;">
        <div class="chip ${(!state.ui.testMatrixCat||state.ui.testMatrixCat==='all')?'active':''}" data-cat="all">Toutes</div>
        ${Object.keys(TEST_CATALOG).map(cat=>`<div class="chip ${state.ui.testMatrixCat===cat?'active':''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</div>`).join('')}
      </div>
      <div class="table-wrap" id="te-team-matrix"></div>
      <div class="legend-row">
        <span><span class="legend-dot" style="background:${TONE_HEX.success}"></span>Dans le haut du groupe</span>
        <span><span class="legend-dot" style="background:${TONE_HEX.danger}"></span>Dans le bas du groupe</span>
        <span><span class="legend-dot" style="background:${TONE_HEX.muted}"></span>Proche de la moyenne</span>
      </div>
    </div>
  `;
  document.getElementById('te-team-testkey').onchange = (e)=>{ state.ui.selectedTestKey = e.target.value; renderTestsTeamBody(); };
  document.getElementById('te-scatter-cross-toggle').onclick = ()=>{ state.ui.scatterCrossMode = !crossMode; renderTestsTeamBody(); };
  if(crossMode){
    document.getElementById('te-scatter-x').onchange = (e)=>{ state.ui.scatterXKey = e.target.value; renderTestScatter(); };
    document.getElementById('te-scatter-y').onchange = (e)=>{ state.ui.scatterYKey = e.target.value; renderTestScatter(); };
  }
  document.querySelectorAll('#te-matrix-cat .chip').forEach(c=>{
    c.addEventListener('click', ()=>{ state.ui.testMatrixCat = c.dataset.cat; renderTestTeamMatrix(); });
  });
  renderTestTeamRanking(selKey);
  renderTestPositionComparison(selKey);
  renderTestScatter();
  renderTestTeamMatrix();
}

function abbrevName(p){ return (p.firstName.charAt(0)+'.'+p.lastName.charAt(0)).toUpperCase(); }

function renderTestScatter(){
  const crossMode = !!state.ui.scatterCrossMode;
  const scope = playersInScope();

  if(!crossMode){
    // Un seul test : classement du meilleur au moins bon, points reliés, initiales en abscisse.
    const key = state.ui.selectedTestKey || 'vma';
    const def = TEST_INDEX[key];
    const rows = scope.map(p=>({p, val: latestTestValue(p.id, key)})).filter(r=>r.val!=null);
    rows.sort((a,b)=> def.better==='lower' ? a.val-b.val : b.val-a.val);
    upsertChart('chart-test-scatter', {
      type:'line',
      data:{
        labels: rows.map(r=>abbrevName(r.p)),
        datasets:[{
          data: rows.map(r=>r.val), borderColor:'#E8661C', backgroundColor:'#E8661C',
          pointRadius:6, pointHoverRadius:8, tension:.25, fill:false,
        }]
      },
      options:{
        plugins:{
          legend:{display:false},
          tooltip:{ callbacks:{ title:(items)=> rows[items[0].dataIndex] ? playerName(rows[items[0].dataIndex].p) : '' } },
          datalabels:{display:false}
        },
        scales:{
          x:{ ticks:{color:CHART_DEFAULTS.color}, grid:{display:false} },
          y:{ title:{display:true, text:def.label+' ('+def.unit+')', color:CHART_DEFAULTS.color}, ticks:{color:CHART_DEFAULTS.color}, grid:{color:CHART_DEFAULTS.grid} }
        }
      }
    });
    return;
  }

  // Mode croisé : deux tests différents, vrai nuage de points X/Y avec initiales sous chaque point.
  const xKey = state.ui.scatterXKey || 'vma';
  const yKey = state.ui.scatterYKey || 'sprint10';
  const xDef = TEST_INDEX[xKey], yDef = TEST_INDEX[yKey];
  const points = scope.map(p=>{
    const x = latestTestValue(p.id, xKey);
    const y = latestTestValue(p.id, yKey);
    if(x==null || y==null) return null;
    return {x, y, label: abbrevName(p), fullName: playerName(p)};
  }).filter(Boolean);

  upsertChart('chart-test-scatter', {
    type:'scatter',
    data:{ datasets:[{ data:points, backgroundColor:'#E8661C', pointRadius:6, pointHoverRadius:8, borderColor:'#0A0E13', borderWidth:1.5 }] },
    options:{
      plugins:{
        legend:{display:false},
        tooltip:{ callbacks:{ label:(ctx)=> `${ctx.raw.fullName} — ${xDef.label} ${ctx.raw.x}${xDef.unit}, ${yDef.label} ${ctx.raw.y}${yDef.unit}` } },
        datalabels:{
          display:true, align:'bottom', anchor:'end', offset:6,
          color: CHART_DEFAULTS.color, font:{size:10, weight:'600'},
          formatter:(val)=> val.label,
        }
      },
      scales:{
        x:{ title:{display:true, text:xDef.label+' ('+xDef.unit+')', color:CHART_DEFAULTS.color}, ticks:{color:CHART_DEFAULTS.color}, grid:{color:CHART_DEFAULTS.grid} },
        y:{ title:{display:true, text:yDef.label+' ('+yDef.unit+')', color:CHART_DEFAULTS.color}, ticks:{color:CHART_DEFAULTS.color}, grid:{color:CHART_DEFAULTS.grid} }
      }
    }
  });
}

function renderTestTeamRanking(key){
  const target = document.getElementById('te-team-ranking');
  const def = TEST_INDEX[key];
  const scope = playersInScope();
  const rows = scope.map(p=>({p, val: latestTestValue(p.id, key)})).filter(r=>r.val!=null);
  if(!rows.length){ target.innerHTML = `<p class="help-text">Aucun résultat enregistré pour ce test.</p>`; return; }
  rows.sort((a,b)=> def.better==='lower' ? a.val-b.val : b.val-a.val);
  const vals = rows.map(r=>r.val);
  const best = def.better==='lower'? Math.min(...vals) : Math.max(...vals);
  const worst = def.better==='lower'? Math.max(...vals) : Math.min(...vals);
  const range = Math.abs(best-worst) || 1;
  target.innerHTML = rows.map((r,i)=>{
    const pct = Math.abs(r.val-worst)/range*100;
    const tone = i===0? 'success' : (i===rows.length-1? 'danger' : 'info');
    return `<div class="priority-item" style="cursor:pointer;" data-goto="${r.p.id}">
      <span class="priority-rank">${i+1}</span>
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><b>${escapeHtml(playerName(r.p))}</b><span class="mono">${r.val} ${def.unit}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(pct,4)}%;background:${TONE_HEX[tone]};"></div></div>
      </div>
    </div>`;
  }).join('');
  target.querySelectorAll('[data-goto]').forEach(row=>{
    row.addEventListener('click', ()=>{
      state.ui.selectedPlayerId = row.dataset.goto;
      state.ui.testsView = 'player';
      renderTests();
    });
  });
}

function renderTestPositionComparison(key){
  const target = document.getElementById('te-position-comparison');
  if(!target) return;
  const def = TEST_INDEX[key];
  const scope = playersInScope().filter(p=>p.position);
  const byPosition = {};
  scope.forEach(p=>{
    const v = latestTestValue(p.id, key);
    if(v==null) return;
    (byPosition[p.position] = byPosition[p.position]||[]).push(v);
  });
  const rows = POSITIONS.map(pos=>({pos, vals: byPosition[pos]||[]})).filter(r=>r.vals.length);
  if(!rows.length){ target.innerHTML = `<p class="help-text">Aucun résultat avec un poste renseigné pour ce test — complétez le poste des joueurs dans Effectif.</p>`; return; }
  const avgs = rows.map(r=>mean(r.vals));
  const best = def.better==='lower'? Math.min(...avgs) : Math.max(...avgs);
  const worst = def.better==='lower'? Math.max(...avgs) : Math.min(...avgs);
  const range = Math.abs(best-worst) || 1;
  target.innerHTML = `<div class="grid grid-3">` + rows.map((r,i)=>{
    const avg = mean(r.vals);
    const pct = Math.abs(avg-worst)/range*100;
    const isBest = avg===best;
    return `<div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;"><b>${escapeHtml(r.pos)}</b><span class="mono">${round1(avg)} ${def.unit}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(pct,6)}%;background:${isBest?TONE_HEX.success:TONE_HEX.info};"></div></div>
      <div class="help-text" style="margin-top:3px;">${r.vals.length} joueur(s)</div>
    </div>`;
  }).join('') + `</div>`;
}

function renderTestTeamMatrix(){
  const target = document.getElementById('te-team-matrix');
  const scope = playersInScope();
  const cat = state.ui.testMatrixCat || 'all';
  const tests = cat==='all' ? Object.values(TEST_INDEX) : (TEST_CATALOG[cat]||[]).map(d=>({...d, cat}));

  // Moyenne/écart-type par colonne, pour colorer chaque cellule selon sa position relative au groupe.
  const colStats = {};
  tests.forEach(d=>{
    const vals = scope.map(p=>latestTestValue(p.id, d.key)).filter(v=>v!=null);
    colStats[d.key] = { mean: mean(vals), sd: stdev(vals) };
  });

  target.innerHTML = `<table><thead><tr><th style="position:sticky;left:0;background:var(--surface);">Joueur</th>${tests.map(d=>`<th>${escapeHtml(d.label)}</th>`).join('')}</tr></thead><tbody>
    ${scope.map(p=>`<tr><td style="position:sticky;left:0;background:var(--surface);"><b>${escapeHtml(playerName(p))}</b></td>${tests.map(d=>{
      const v = latestTestValue(p.id, d.key);
      if(v==null) return `<td class="mono" style="color:var(--text-muted);">—</td>`;
      const st = colStats[d.key];
      let bg = 'transparent', fg = 'inherit';
      if(st.sd>0){
        let z = (v-st.mean)/st.sd;
        if(d.better==='lower') z = -z;
        if(z>=0.6){ bg = 'var(--success-soft)'; fg = 'var(--success)'; }
        else if(z<=-0.6){ bg = 'var(--danger-soft)'; fg = 'var(--danger)'; }
      }
      return `<td class="mono" style="background:${bg};color:${fg};font-weight:600;">${v} ${d.unit}</td>`;
    }).join('')}</tr>`).join('')}
  </tbody></table>`;
}

function renderTestEvolChart(){
  const playerId = state.ui.selectedPlayerId;
  const key = state.ui.selectedTestKey || document.getElementById('te-testkey')?.value || 'vma';
  const def = TEST_INDEX[key];

  if(!state.ui.testCrossMode){
    const hist = playerTestHistory(playerId, key);
    upsertChart('chart-test-evol', {
      type:'line',
      data:{ labels:hist.map(t=>fmtDate(t.date)), datasets:[{ label:def.label, data:hist.map(t=>t.value), borderColor:'#E8661C', backgroundColor:'rgba(232,106,28,.12)', fill:true, tension:.25, pointRadius:4 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:CHART_DEFAULTS.color},grid:{display:false}}, y:{ticks:{color:CHART_DEFAULTS.color},grid:{color:CHART_DEFAULTS.grid}, title:{display:true,text:def.unit,color:CHART_DEFAULTS.color}} } }
    });
    return;
  }

  // Mode croisé : deux tests superposés dans le temps pour ce joueur, chacun avec son propre axe
  // (les unités/échelles diffèrent généralement, ex. km/h vs cm).
  const key2 = state.ui.selectedTestKey2 || document.getElementById('te-testkey-2')?.value || 'sprint10';
  const def2 = TEST_INDEX[key2];
  const hist1 = playerTestHistory(playerId, key);
  const hist2 = playerTestHistory(playerId, key2);
  const allDates = [...new Set([...hist1.map(t=>t.date), ...hist2.map(t=>t.date)])].sort();
  const map1 = Object.fromEntries(hist1.map(t=>[t.date,t.value]));
  const map2 = Object.fromEntries(hist2.map(t=>[t.date,t.value]));

  const vals1 = allDates.map(d=>map1[d]).filter(v=>v!=null);
  const vals2 = allDates.map(d=>map2[d]).filter(v=>v!=null);
  const axisRange = (vals)=>{
    if(!vals.length) return {min:undefined, max:undefined};
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const pad = (mx-mn)>0 ? (mx-mn)*0.25 : (Math.abs(mn)*0.1 || 1);
    return { min: round1(mn-pad), max: round1(mx+pad) };
  };
  const r1 = axisRange(vals1), r2 = axisRange(vals2);

  upsertChart('chart-test-evol', {
    type:'line',
    data:{
      labels: allDates.map(fmtDate),
      datasets:[
        { label:def.label, data:allDates.map(d=>map1[d]??null), borderColor:'#E8661C', backgroundColor:'#E8661C', pointBackgroundColor:'#E8661C', fill:false, tension:.25, pointRadius:5, pointHoverRadius:7, spanGaps:true, yAxisID:'y' },
        { label:def2.label, data:allDates.map(d=>map2[d]??null), borderColor:'#4FA3FF', backgroundColor:'#4FA3FF', pointBackgroundColor:'#4FA3FF', fill:false, tension:.25, pointRadius:5, pointHoverRadius:7, spanGaps:true, yAxisID:'y1' },
      ]
    },
    options:{
      plugins:{legend:{display:true, position:'bottom', labels:{color:CHART_DEFAULTS.color}}},
      scales:{
        x:{ticks:{color:CHART_DEFAULTS.color},grid:{display:false}, offset:true},
        y:{position:'left', min:r1.min, max:r1.max, ticks:{color:'#E8661C'}, grid:{color:CHART_DEFAULTS.grid}, title:{display:true,text:def.label+' ('+def.unit+')',color:'#E8661C'}},
        y1:{position:'right', min:r2.min, max:r2.max, ticks:{color:'#4FA3FF'}, grid:{display:false}, title:{display:true,text:def2.label+' ('+def2.unit+')',color:'#4FA3FF'}},
      }
    }
  });

  const evolNote = document.getElementById('te-evol-note');
  if(evolNote){
    const missing = [];
    if(hist1.length===0) missing.push(def.label);
    if(hist2.length===0) missing.push(def2.label);
    if(missing.length){
      evolNote.textContent = `Aucun test « ${missing.join(' » et « ')} » enregistré pour ce joueur pour l'instant — ajoutez-en un via « + Nouveau test ».`;
    } else if(hist1.length===1 || hist2.length===1){
      evolNote.textContent = `Un seul test enregistré sur l'un des deux (ou les deux) à ce jour — le graphique s'enrichira à mesure des prochaines saisies.`;
    } else {
      evolNote.textContent = '';
    }
  }
}

function renderTestSummary(){
  const target = document.getElementById('te-summary');
  const playerId = state.ui.selectedPlayerId;
  const rows = Object.values(TEST_INDEX).map(def=>{
    const val = latestTestValue(playerId, def.key);
    if(val==null) return null;
    const d = testDeltas(playerId, def.key, val, null);
    return {def, val, d};
  }).filter(Boolean);
  if(!rows.length){ target.innerHTML = `<p class="help-text">Aucun test enregistré pour ce joueur.</p>`; return; }
  target.innerHTML = rows.map(r=>`
    <div class="priority-item">
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;"><b>${r.def.label}</b><span class="mono">${r.val} ${r.def.unit}</span></div>
        <div class="help-text">delta dernier : ${r.d.deltaLast!=null? (r.d.deltaLast>0?'+':'')+r.d.deltaLast : '—'} · meilleur : ${r.d.best??'—'}</div>
      </div>
    </div>`).join('');
}

function renderTestHistory(){
  const target = document.getElementById('te-history');
  const list = [...state.tests].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25);
  if(!list.length){ target.innerHTML = `<div class="empty-state"><h4>Aucun test</h4><p>Ajoutez une première mesure.</p></div>`; return; }
  target.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Joueur</th><th>Test</th><th>Valeur</th><th>Δ dernier</th><th>% évol.</th><th>Δ meilleur</th><th></th></tr></thead><tbody>
    ${list.map(t=>{
      const p = playerById(t.playerId); const def = TEST_INDEX[t.testKey];
      const d = testDeltas(t.playerId, t.testKey, t.value, t.id);
      const goodDelta = d.deltaLast==null? true : (def.better==='higher'? d.deltaLast>=0 : d.deltaLast<=0);
      return `<tr data-id="${t.id}"><td>${fmtDate(t.date)}</td><td><b>${escapeHtml(playerName(p))}</b></td><td>${def.label}</td><td class="mono">${t.value} ${def.unit}</td>
        <td>${d.deltaLast!=null? pill((d.deltaLast>0?'+':'')+d.deltaLast, goodDelta?'success':'danger') : '—'}</td>
        <td class="mono">${d.pctLast!=null?(d.pctLast>0?'+':'')+d.pctLast+'%':'—'}</td>
        <td class="mono">${d.deltaBest!=null?d.deltaBest:'—'}</td>
        <td style="text-align:right;"><button class="icon-btn btn-danger" data-act="del">🗑</button></td></tr>`;
    }).join('')}
  </tbody></table></div>`;
  target.querySelectorAll('tbody tr').forEach(tr=>{
    tr.querySelector('[data-act=del]').addEventListener('click', ()=>{
      if(confirmDialog('Supprimer ce test ?')){ state.tests = state.tests.filter(x=>x.id!==tr.dataset.id); persist('tests'); renderTests(); }
    });
  });
}

function openTestForm(){
  const t = {id:uid('ts'), date:todayISO(), playerId:state.ui.selectedPlayerId, testKey: state.ui.selectedTestKey||'vma', period:'', comment:''};
  openModal({
    title:'Nouveau test physique',
    bodyHtml:`
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" name="date" value="${t.date}"></div>
        <div class="field"><label>Joueur</label><select name="playerId">${playerOptionsHtml(t.playerId,null)}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Test</label><select name="testKey" id="tf-key">${testOptionsHtml(t.testKey)}</select></div>
        <div class="field"><label>Valeur (<span id="tf-unit">${TEST_INDEX[t.testKey].unit}</span>)</label><input type="number" step="0.01" name="value" required id="tf-value"></div>
      </div>
      <div class="field" id="tf-rsi-field" style="display:none;"><label>RSI associé</label><input type="number" step="0.01" name="rsiValue" id="tf-rsi-value" placeholder="ex : 1.8"></div>
      <div class="field"><label>Période</label><input name="period" placeholder="ex : pré-saison, mi-saison…"></div>
      <div class="field"><label>Commentaire</label><textarea name="comment"></textarea></div>
      <div id="tf-preview" class="help-text"></div>
    `,
    onMount:()=>{
      const keySel = document.getElementById('tf-key'), valInput = document.getElementById('tf-value'), unitSpan=document.getElementById('tf-unit');
      const rsiField = document.getElementById('tf-rsi-field');
      const updatePreview = ()=>{
        unitSpan.textContent = TEST_INDEX[keySel.value].unit;
        rsiField.style.display = TEST_INDEX[keySel.value].rsiKey ? 'block' : 'none';
        const v = Number(valInput.value);
        const pid = document.querySelector('[name=playerId]').value;
        if(!isNaN(v) && v!==0 && pid){
          const d = testDeltas(pid, keySel.value, v, null);
          document.getElementById('tf-preview').textContent = d.deltaLast!=null? `Delta vs dernier test : ${d.deltaLast>0?'+':''}${d.deltaLast} — vs meilleur : ${d.deltaBest}` : 'Premier test enregistré pour ce joueur sur cet exercice.';
        }
      };
      keySel.onchange = updatePreview; valInput.oninput = updatePreview; document.querySelector('[name=playerId]').onchange = updatePreview;
      updatePreview();
    },
    onSubmit: async (fd, close)=>{
      const upd = {...t};
      ['date','playerId','testKey','period','comment'].forEach(k=>upd[k]=fd.get(k));
      upd.value = Number(fd.get('value'));
      if(!upd.playerId){ showToast('Sélectionnez un joueur.'); return; }
      state.tests.push(upd);
      let extra = 0;
      const rsiKey = TEST_INDEX[upd.testKey]?.rsiKey;
      const rsiRaw = fd.get('rsiValue');
      if(rsiKey && rsiRaw!==''){
        state.tests.push({ id:uid('ts'), date:upd.date, playerId:upd.playerId, testKey:rsiKey, value:Number(rsiRaw), period:upd.period, comment:upd.comment });
        extra = 1;
      }
      await persist('tests'); close();
      state.ui.selectedPlayerId = upd.playerId; state.ui.selectedTestKey = upd.testKey;
      renderTests();
      showToast(extra? 'Test et RSI enregistrés.' : 'Test enregistré.');
    }
  });
}

            <button class="btn btn-ghost btn-sm" data-pdf="${s.id}">📄 PDF</button>
          </div>
        </div>`).join('') : `<div class="card empty-state" style="grid-column:1/-1;"><h4>Aucune séance</h4><p>Créez votre première séance type.</p></div>`}
    </div>
  `;
  document.getElementById('btn-add-session').onclick = ()=>openSessionForm();
  el.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{ state.ui.seanceFilterDominant=c.dataset.dom; renderSeances(); }));
  el.querySelectorAll('.grid .card[data-id]').forEach(card=>card.addEventListener('click',(e)=>{
    if(e.target.closest('[data-pdf]')) return;
    openSessionForm(state.sessions.find(s=>s.id===card.dataset.id));
  }));
  el.querySelectorAll('[data-pdf]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); printSessionSheet(state.sessions.find(s=>s.id===btn.dataset.pdf)); });
  });
}

let sessionExercisesDraft = [];

function exerciseRowHtml(ex, i){
  return `<div class="card" style="background:var(--surface-raised);padding:12px 14px;margin-bottom:10px;" data-ex-row="${ex.id}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span class="eyebrow">Exercice ${i+1}</span>
      <button type="button" class="icon-btn btn-danger" data-del-ex="${ex.id}">🗑</button>
    </div>
    <div class="field" style="margin-bottom:8px;"><input placeholder="Nom de l'exercice" value="${escapeHtml(ex.name||'')}" data-ex-field="name" data-ex-id="${ex.id}"></div>
    <div class="field-row3" style="margin-bottom:8px;">
      <input placeholder="Séries" value="${escapeHtml(ex.series||'')}" data-ex-field="series" data-ex-id="${ex.id}">
      <input placeholder="Répétitions" value="${escapeHtml(ex.reps||'')}" data-ex-field="reps" data-ex-id="${ex.id}">
      <input placeholder="Récupération" value="${escapeHtml(ex.recup||'')}" data-ex-field="recup" data-ex-id="${ex.id}">
    </div>
    <div class="field-row" style="margin-bottom:0;">
      <input placeholder="Tempo / intention (ex : 2-0-2, explosif…)" value="${escapeHtml(ex.tempo||'')}" data-ex-field="tempo" data-ex-id="${ex.id}">
      <input placeholder="Lien vidéo (optionnel)" value="${escapeHtml(ex.videoUrl||'')}" data-ex-field="videoUrl" data-ex-id="${ex.id}">
    </div>
  </div>`;
}
function renderExercisesEditor(){
  const list = document.getElementById('se-exercises-list');
  if(!list) return;
  list.innerHTML = sessionExercisesDraft.length
    ? sessionExercisesDraft.map((ex,i)=>exerciseRowHtml(ex,i)).join('')
    : `<p class="help-text">Aucun exercice ajouté pour l'instant — cliquez sur « + Ajouter un exercice ».</p>`;
}
// Délégation d'événements sur le conteneur parent : reste fonctionnel même après
// un réaffichage de la liste (ajout/suppression), contrairement à des écouteurs
// attachés un par un sur chaque champ.
document.addEventListener('input', (e)=>{
  if(e.target.matches('[data-ex-field]')){
    const ex = sessionExercisesDraft.find(x=>x.id===e.target.dataset.exId);
    if(ex) ex[e.target.dataset.exField] = e.target.value;
  }
});
document.addEventListener('click', (e)=>{
  const delBtn = e.target.closest('[data-del-ex]');
  if(delBtn){
    sessionExercisesDraft = sessionExercisesDraft.filter(x=>x.id!==delBtn.dataset.delEx);
    renderExercisesEditor();
  }
});

function openSessionForm(existing){
  const s = existing || {id:uid('se'), category:SESSION_CATEGORIES[0]};
  sessionExercisesDraft = (s.exercises||[]).map(ex=>({...ex}));
  if(!existing && !sessionExercisesDraft.length){
    sessionExercisesDraft.push({id:uid('ex'), name:'', series:'', reps:'', recup:'', tempo:'', videoUrl:''});
  }
  openModal({
    title: existing?'Modifier la séance':'Nouvelle séance',
    wide:true,
    submitLabel: existing?'Enregistrer':'Ajouter à la bibliothèque',
    extraFootHtml: existing? `<button type="button" class="btn btn-ghost btn-danger btn-sm" id="btn-del-session">Supprimer</button>` : '',
    bodyHtml:`
      <div class="field-row">
        <div class="field"><label>Code séance</label><input name="code" value="${escapeHtml(s.code||'')}" required></div>
        <div class="field"><label>Nom séance</label><input name="name" value="${escapeHtml(s.name||'')}" required></div>
      </div>
      <div class="field-row3">
        <div class="field"><label>Dominante</label><select name="dominant">${DOMINANTS.map(d=>`<option ${d===s.dominant?'selected':''}>${d}</option>`).join('')}</select></div>
        <div class="field"><label>Sous-dominante</label><select name="subDominant"><option value="">—</option>${SUB_DOMINANTS.map(d=>`<option ${d===s.subDominant?'selected':''}>${d}</option>`).join('')}</select></div>
        <div class="field"><label>Catégorie</label><select name="category">${SESSION_CATEGORIES.map(c=>`<option ${c===s.category?'selected':''}>${c}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>RPE cible /10</label><input type="number" min="1" max="10" name="rpeTarget" value="${s.rpeTarget??''}"></div>
        <div class="field"><label>Durée prévue (min)</label><input type="number" name="duration" value="${s.duration??''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Effectif cible</label><select name="targetGroupSize"><option value="">—</option>${TARGET_GROUP_SIZES.map(g=>`<option ${g===s.targetGroupSize?'selected':''}>${g}</option>`).join('')}</select></div>
        <div class="field"><label>Groupe concerné</label><select name="group"><option value="">—</option>${groupOptionsHtml(s.group,false)}</select></div>
      </div>
      <div class="field"><label>Date (optionnel)</label><input type="date" name="planDate" value="${s.planDate||''}"><p class="hint" style="margin-top:4px;">Si renseignée (avec un groupe concerné), la séance est ajoutée automatiquement au planning de la semaine à cette date.</p></div>
      <div class="field-row">
        <label style="display:flex;align-items:center;gap:8px;font-weight:500;"><input type="checkbox" name="compatibleReturn" ${s.compatibleReturn?'checked':''} style="width:auto;">Compatible retour progressif</label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:500;"><input type="checkbox" name="compatibleInjured" ${s.compatibleInjured?'checked':''} style="width:auto;">Compatible joueur blessé</label>
      </div>

      <button type="button" class="btn btn-ghost btn-sm" id="se-toggle-more" style="margin-top:6px;">+ Plus de détails (objectif, matériel, description…)</button>
      <div id="se-more-details" style="display:none;margin-top:12px;">
        <div class="field"><label>Objectif principal</label><input name="objective" value="${escapeHtml(s.objective||'')}"></div>
        <div class="field"><label>Matériel</label><input name="equipment" value="${escapeHtml(s.equipment||'')}"></div>
        <div class="field"><label>Description</label><textarea name="description">${escapeHtml(s.description||'')}</textarea></div>
        <div class="field"><label>Contraintes</label><textarea name="constraints">${escapeHtml(s.constraints||'')}</textarea></div>
        <div class="field"><label>Variante</label><textarea name="variant">${escapeHtml(s.variant||'')}</textarea></div>
      </div>

      <div class="divider"></div>
      <div class="field" style="display:flex;align-items:center;justify-content:space-between;">
        <label style="margin:0;">Exercices de la séance</label>
        <button type="button" class="btn btn-ghost btn-sm" id="se-add-exercise">+ Ajouter un exercice</button>
      </div>
      <div id="se-exercises-list" style="margin-top:10px;"></div>
    `,
    onMount: ()=>{
      const moreBtn = document.getElementById('se-toggle-more'), moreBox = document.getElementById('se-more-details');
      moreBtn.onclick = ()=>{
        const show = moreBox.style.display==='none';
        moreBox.style.display = show? 'block':'none';
        moreBtn.textContent = show? '− Masquer les détails' : '+ Plus de détails (objectif, matériel, description…)';
      };
      if(existing){ const del = document.getElementById('btn-del-session'); if(del) del.onclick = ()=>{ if(confirmDialog('Supprimer cette séance ? Elle sera aussi retirée du planning si elle y avait été ajoutée.')){
        state.sessions = state.sessions.filter(x=>x.id!==s.id);
        persist('sessions');
        const linkedPlanning = state.planning.filter(pl=>pl.sessionId===s.id);
        if(linkedPlanning.length){
          state.planning = state.planning.filter(pl=>pl.sessionId!==s.id);
          persist('planning');
        }
        document.getElementById('modal-backdrop').remove(); renderSeances();
      } }; }
      document.getElementById('se-add-exercise').onclick = ()=>{
        sessionExercisesDraft.push({id:uid('ex'), name:'', series:'', reps:'', recup:'', tempo:'', videoUrl:''});
        renderExercisesEditor();
      };
      renderExercisesEditor();
    },
    onSubmit: async (fd, close)=>{
      const upd = {...s};
      ['code','name','objective','dominant','subDominant','category','rpeTarget','duration','targetGroupSize','group','equipment','description','constraints','variant','planDate'].forEach(k=>upd[k]=fd.get(k));
      upd.compatibleReturn = fd.get('compatibleReturn')==='on'; upd.compatibleInjured = fd.get('compatibleInjured')==='on';
      upd.exercises = sessionExercisesDraft.filter(ex=>ex.name && ex.name.trim());
      const idx = state.sessions.findIndex(x=>x.id===s.id);
      if(idx>=0) state.sessions[idx]=upd; else state.sessions.push(upd);
      await persist('sessions');

      // Si une date (et un groupe) sont renseignées, on ajoute/actualise automatiquement le planning.
      if(upd.planDate && upd.group){
        const already = state.planning.find(pl=>pl.kind!=='annual' && pl.date===upd.planDate && pl.group===upd.group && pl.sessionId===upd.id);
        if(already){
          already.sessionName = upd.name; already.objective = upd.objective; already.dominant = upd.dominant;
          already.duration = upd.duration; already.intensity = intensityFromRPE(upd.rpeTarget);
        } else {
          state.planning.push({
            id: uid('pw'), kind:'weekly', date: upd.planDate, group: upd.group, sessionId: upd.id,
            sessionName: upd.name, slot:'', objective: upd.objective||'', dominant: upd.dominant||'',
            intensity: intensityFromRPE(upd.rpeTarget), duration: upd.duration||'', location:'', responsible:'', remark:''
          });
        }
        await persist('planning');
      }

      close(); renderSeances();
      showToast('Séance enregistrée.'+(upd.planDate&&upd.group? ' Ajoutée au planning.' : ''));
    }
  });
}

/* --- Export PDF (impression) d'une fiche séance --- */
function printSessionSheet(session){
  const rows = (session.exercises||[]).map((ex,i)=>`
    <tr>
      <td>${i+1}</td>
      <td><b>${escapeHtml(ex.name||'')}</b>${ex.videoUrl? ` <a href="${escapeHtml(ex.videoUrl)}" target="_blank">▶ vidéo</a>`:''}</td>
      <td>${escapeHtml(ex.series||'—')}</td>
      <td>${escapeHtml(ex.reps||'—')}</td>
      <td>${escapeHtml(ex.recup||'—')}</td>
      <td>${escapeHtml(ex.tempo||'—')}</td>
    </tr>`).join('');
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>${escapeHtml(session.name||'Séance')}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;padding:32px;max-width:800px;margin:0 auto;}
    h1{font-size:22px;margin-bottom:2px;}
    .meta{color:#555;font-size:13px;margin-bottom:18px;}
    .badges span{display:inline-block;background:#eee;border-radius:12px;padding:3px 10px;font-size:11px;margin-right:6px;}
    table{width:100%;border-collapse:collapse;margin-top:16px;}
    th,td{border:1px solid #ccc;padding:8px 10px;font-size:13px;text-align:left;}
    th{background:#f2f2f2;text-transform:uppercase;font-size:10px;letter-spacing:.04em;}
    .desc{margin-top:18px;font-size:13px;line-height:1.5;}
    .desc b{display:block;margin-bottom:2px;}
    @media print{ a{color:#111;text-decoration:none;} }
  </style></head><body>
    <h1>${escapeHtml(session.name||'')}</h1>
    <div class="meta">Code ${escapeHtml(session.code||'—')} · ${escapeHtml(session.dominant||'')}${session.subDominant? ' / '+escapeHtml(session.subDominant):''} · ${session.duration||'—'} min · RPE cible ${session.rpeTarget||'—'}/10</div>
    <div class="badges">
      ${session.category? `<span>${escapeHtml(session.category)}</span>`:''}
      ${session.compatibleReturn? `<span>Retour progressif OK</span>`:''}
      ${session.compatibleInjured? `<span>Compatible blessé</span>`:''}
    </div>
    ${session.objective? `<div class="desc"><b>Objectif</b>${escapeHtml(session.objective)}</div>`:''}
    ${session.description? `<div class="desc"><b>Description</b>${escapeHtml(session.description)}</div>`:''}
    ${rows? `<table><thead><tr><th>#</th><th>Exercice</th><th>Séries</th><th>Répétitions</th><th>Récup.</th><th>Tempo / intention</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="desc">Aucun exercice détaillé pour cette séance.</p>'}
    ${session.equipment? `<div class="desc"><b>Matériel</b>${escapeHtml(session.equipment)}</div>`:''}
    ${session.constraints? `<div class="desc"><b>Contraintes</b>${escapeHtml(session.constraints)}</div>`:''}
  </body></html>`;
  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  win.onload = ()=>win.print();
  setTimeout(()=>{ try{ win.print(); }catch(e){} }, 300);
}

/* =======================================================================
   PLANNING HEBDOMADAIRE + PLANIFICATION ANNUELLE
   ======================================================================= */

const DAY_LABELS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const INTENSITY_LEVELS = [ {label:'Faible',tone:'success'}, {label:'Modérée',tone:'warning'}, {label:'Forte',tone:'caution'}, {label:'Très forte',tone:'danger'} ];
function intensityFromRPE(rpe){
  if(!rpe) return '';
  if(rpe<=3) return 'Faible';
  if(rpe<=6) return 'Modérée';
  if(rpe<=8) return 'Forte';
  return 'Très forte';
}
const ANNUAL_TYPES = [ {label:'Charge',tone:'caution'}, {label:'Décharge',tone:'success'}, {label:'Test',tone:'info'}, {label:'Compétition',tone:'accent'}, {label:'Reprise',tone:'warning'} ];

function startOfWeek(iso){ const d = new Date(iso+'T00:00:00'); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return toISODateLocal(d); }
if(!state.ui.planningWeekStart) state.ui.planningWeekStart = startOfWeek(todayISO());

function renderPlanning(){
  const el = document.getElementById('tab-planning');
  const weekStart = state.ui.planningWeekStart;
  const days = [...Array(7)].map((_,i)=>addDays(weekStart,i));
  const weeklyEntries = state.planning.filter(x=>x.kind!=='annual');
  const annualEntries = state.planning.filter(x=>x.kind==='annual').sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));

  el.innerHTML = `
    <div class="panel-head">
      <div><h2>Planning</h2><p>Planning hebdomadaire terrain + vue macro de la saison.</p></div>
    </div>

    <div class="card" style="margin-bottom:22px;">
      <div class="card-title">
        <h3>Semaine du ${fmtDate(weekStart)} au ${fmtDate(addDays(weekStart,6))}</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" id="pl-prev">← Semaine préc.</button>
          <button class="btn btn-ghost btn-sm" id="pl-today">Aujourd'hui</button>
          <button class="btn btn-ghost btn-sm" id="pl-next">Semaine suiv. →</button>
        </div>
      </div>
      <div class="week-grid">
        ${days.map((d,i)=>{
          const entries = weeklyEntries.filter(e=>e.date===d);
          return `<div class="day-col">
            <div class="day-head">${DAY_LABELS[i]}<br><span class="mono">${fmtDate(d)}</span></div>
            ${entries.map(e=>{
              const intensity = INTENSITY_LEVELS.find(x=>x.label===e.intensity) || {tone:'muted'};
              return `<div class="day-slot filled" data-id="${e.id}" style="border-color:${TONE_HEX[intensity.tone]};">
                <div class="stitle">${escapeHtml(e.objective||e.sessionName||'Séance')}</div>
                <div class="smeta">${escapeHtml(e.group||'')} ${e.duration?'· '+e.duration+' min':''}</div>
                <div style="margin-top:4px;">${pill(e.intensity||'—', intensity.tone)}</div>
              </div>`;
            }).join('')}
            <div class="day-slot" data-newday="${d}">+ Ajouter</div>
          </div>`;
        }).join('')}
      </div>
      <div class="legend-row">${INTENSITY_LEVELS.map(l=>`<span><span class="legend-dot" style="background:${TONE_HEX[l.tone]}"></span>${l.label}</span>`).join('')}</div>
    </div>

    <div class="card">
      <div class="card-title"><h3>Planification annuelle — macro-cycles</h3>
        <button class="btn btn-accent btn-sm" id="btn-add-annual">+ Ajouter un cycle</button>
      </div>
      ${annualEntries.length? annualEntries.map(a=>{
        const type = ANNUAL_TYPES.find(t=>t.label===a.type)||{tone:'muted'};
        return `<div class="priority-item" data-id="${a.id}" style="cursor:pointer;">
          <span class="pill ${toneClass(type.tone)}">${escapeHtml(a.type||'—')}</span>
          <div style="flex:1;">
            <div style="font-weight:600;">${escapeHtml(a.label)} <span class="help-text">(${fmtDate(a.startDate)} → ${fmtDate(a.endDate)})</span></div>
            <div class="help-text">${escapeHtml(a.objective||'')}</div>
          </div>
        </div>`;
      }).join('') : `<p class="help-text">Aucun cycle défini. Ajoutez vos périodes de charge/décharge, tests et compétitions pour piloter la saison.</p>`}
    </div>
  `;

  document.getElementById('pl-prev').onclick = ()=>{ state.ui.planningWeekStart = addDays(weekStart,-7); renderPlanning(); };
  document.getElementById('pl-next').onclick = ()=>{ state.ui.planningWeekStart = addDays(weekStart,7); renderPlanning(); };
  document.getElementById('pl-today').onclick = ()=>{ state.ui.planningWeekStart = startOfWeek(todayISO()); renderPlanning(); };
  document.getElementById('btn-add-annual').onclick = ()=>openAnnualForm();
  el.querySelectorAll('.day-slot[data-newday]').forEach(s=>s.addEventListener('click',()=>openPlanningForm(null, s.dataset.newday)));
  el.querySelectorAll('.day-slot.filled').forEach(s=>s.addEventListener('click',()=>openPlanningForm(weeklyEntries.find(e=>e.id===s.dataset.id))));
  el.querySelectorAll('[data-id]').forEach(row=>{
    if(row.classList.contains('day-slot')) return;
    row.addEventListener('click', ()=>{ const a = annualEntries.find(x=>x.id===row.dataset.id); if(a) openAnnualForm(a); });
  });
}

function openPlanningForm(existing, defaultDate){
  const e = existing || {id:uid('pw'), date: defaultDate||todayISO(), group: state.settings.groups[0]||''};
  openModal({
    title: existing? 'Modifier la séance planifiée':'Ajouter une séance au planning',
    extraFootHtml: existing? `<button type="button" class="btn btn-ghost btn-danger btn-sm" id="btn-del-plan">Supprimer</button>`:'',
    bodyHtml:`
      <div class="field-row3">
        <div class="field"><label>Date</label><input type="date" name="date" value="${e.date}"></div>
        <div class="field"><label>Créneau</label><input name="slot" placeholder="ex : 17h30" value="${escapeHtml(e.slot||'')}"></div>
        <div class="field"><label>Groupe</label><select name="group">${groupOptionsHtml(e.group,false)}</select></div>
      </div>
      <div class="field"><label>Séance (bibliothèque)</label><select name="sessionId"><option value="">— séance libre —</option>${state.sessions.map(s=>`<option value="${s.id}" ${s.id===e.sessionId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>
      <div class="field-row">
        <div class="field"><label>Objectif</label><input name="objective" value="${escapeHtml(e.objective||'')}"></div>
        <div class="field"><label>Dominante</label><select name="dominant"><option value="">—</option>${DOMINANTS.map(d=>`<option ${d===e.dominant?'selected':''}>${d}</option>`).join('')}</select></div>
      </div>
      <div class="field-row3">
        <div class="field"><label>Intensité prévue</label><select name="intensity">${INTENSITY_LEVELS.map(l=>`<option ${l.label===e.intensity?'selected':''}>${l.label}</option>`).join('')}</select></div>
        <div class="field"><label>Durée (min)</label><input type="number" name="duration" value="${e.duration??''}"></div>
        <div class="field"><label>Lieu</label><input name="location" value="${escapeHtml(e.location||'')}"></div>
      </div>
      <div class="field"><label>Responsable</label><input name="responsible" value="${escapeHtml(e.responsible||'')}"></div>
      <div class="field"><label>Remarque</label><textarea name="remark">${escapeHtml(e.remark||'')}</textarea></div>
    `,
    onMount:()=>{ if(existing){ const del=document.getElementById('btn-del-plan'); if(del) del.onclick=()=>{ if(confirmDialog('Supprimer cette séance du planning ?')){ state.planning=state.planning.filter(x=>x.id!==e.id); persist('planning'); document.getElementById('modal-backdrop').remove(); renderPlanning(); } }; } },
    onSubmit: async (fd, close)=>{
      const upd = {...e, kind:'weekly'};
      ['date','slot','group','sessionId','objective','dominant','intensity','duration','location','responsible','remark'].forEach(k=>upd[k]=fd.get(k));
      if(upd.sessionId){ const s = state.sessions.find(x=>x.id===upd.sessionId); if(s) upd.sessionName = s.name; }
      const idx = state.planning.findIndex(x=>x.id===e.id);
      if(idx>=0) state.planning[idx]=upd; else state.planning.push(upd);
      await persist('planning'); close(); renderPlanning();
      showToast('Planning mis à jour.');
    }
  });
}

function openAnnualForm(existing){
  const a = existing || {id:uid('pa'), kind:'annual', type:'Charge'};
  openModal({
    title: existing? 'Modifier le cycle':'Ajouter un macro-cycle',
    extraFootHtml: existing? `<button type="button" class="btn btn-ghost btn-danger btn-sm" id="btn-del-annual">Supprimer</button>`:'',
    bodyHtml:`
      <div class="field"><label>Libellé</label><input name="label" value="${escapeHtml(a.label||'')}" required placeholder="ex : Cycle de reprise, Bloc pré-Euro…"></div>
      <div class="field-row">
        <div class="field"><label>Début</label><input type="date" name="startDate" value="${a.startDate||''}"></div>
        <div class="field"><label>Fin</label><input type="date" name="endDate" value="${a.endDate||''}"></div>
      </div>
      <div class="field"><label>Type</label><select name="type">${ANNUAL_TYPES.map(t=>`<option ${t.label===a.type?'selected':''}>${t.label}</option>`).join('')}</select></div>
      <div class="field"><label>Objectif</label><textarea name="objective">${escapeHtml(a.objective||'')}</textarea></div>
    `,
    onMount:()=>{ if(existing){ const del=document.getElementById('btn-del-annual'); if(del) del.onclick=()=>{ if(confirmDialog('Supprimer ce cycle ?')){ state.planning=state.planning.filter(x=>x.id!==a.id); persist('planning'); document.getElementById('modal-backdrop').remove(); renderPlanning(); } }; } },
    onSubmit: async (fd, close)=>{
      const upd = {...a};
      ['label','startDate','endDate','type','objective'].forEach(k=>upd[k]=fd.get(k));
      const idx = state.planning.findIndex(x=>x.id===a.id);

      await persist('planning'); close(); renderPlanning();

    }

function exportAllData(){
  const backup = { exportedAt: new Date().toISOString(), app:'Fab\'Lab' };
  STORE_KEYS.forEach(k=>{ backup[k] = state[k]; });
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fablab-sauvegarde-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Sauvegarde téléchargée.');
}

async function importAllDataFromFile(file){
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){ showToast('Fichier invalide — ce n\'est pas une sauvegarde Fab\'Lab valide.'); return; }

  const found = STORE_KEYS.filter(k=>data[k]!==undefined);
  if(!found.length){ showToast('Ce fichier ne contient aucune donnée Fab\'Lab reconnaissable.'); return; }

  const dateInfo = data.exportedAt ? ' du '+fmtDate(data.exportedAt.slice(0,10)) : '';
  if(!confirmDialog(`Restaurer cette sauvegarde${dateInfo} ? Cela remplace TOUTES les données actuelles (joueurs, wellness, charge, tests, séances, planning, blessures, mensurations) par celles du fichier, sur tous les appareils. Cette action ne peut pas être annulée.`)) return;
  if(!confirmDialog('Dernière confirmation : vraiment écraser toutes les données actuelles ?')) return;

  suppressRerender = true;
  try{
    for(const k of found){
      state[k] = data[k];
      await saveCollection(k);
    }
  }catch(e){
    console.error(e);
    showToast('Erreur pendant la restauration : '+e.message);
  }
  suppressRerender = false;
  refreshGroupFilterSelect();
  renderTab(state.ui.tab);
  showToast('Sauvegarde restaurée avec succès.');
}

    {id:uid('inj'), playerId:p7.id, date: addDays(todayISO(),-200), zone:'cheville_d', grade:'grade2', examType:'Radio', note:'Entorse'},
    {id:uid('inj'), playerId:p7.id, date: addDays(todayISO(),-90), zone:'cheville_d', grade:'grade1', examType:'', note:'Récidive légère'},
    {id:uid('inj'), playerId:p7.id, date: addDays(todayISO(),-30), zone:'cheville_d', grade:'grade2', examType:'IRM', note:'Nouvelle récidive'},
  );
  await persist('injuries');

  refreshGroupFilterSelect();
  showToast('Données de démonstration chargées.');
  renderTab(state.ui.tab);
}

async function resetAllData(){
  if(!confirmDialog('Cette action supprime définitivement toutes les données de Fab\'Lab (joueurs, wellness, charge, tests, séances, planning), sur tous les appareils. Continuer ?')) return;
  suppressRerender = true;
  for(const name of STORE_KEYS){
    try{ await fbDB.ref('fablab/'+name).remove(); }catch(e){ console.error(e); }
  }
  state.players=[]; state.wellness=[]; state.loads=[]; state.tests=[]; state.sessions=[]; state.planning=[]; state.injuries=[];
  state.settings = {groups:[...DEFAULT_GROUPS]};
  await persist('settings');
  suppressRerender = false;
  refreshGroupFilterSelect();
  showToast('Toutes les données ont été réinitialisées.');
  renderTab(state.ui.tab);
}

/* =======================================================================
   BOOTSTRAP
   ======================================================================= */

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(`Délai dépassé pendant : ${label}. Vérifiez votre connexion internet.`)), ms))
  ]);
}

async function boot(){
  try{
    await withTimeout(loadAll(), 15000, 'chargement des données');
    renderSidebarFiltered();
    refreshGroupFilterSelect();
    updateTopbarCtx();

    if(IS_KIOSK && playerById(KIOSK_PLAYER_ID)){
      document.body.classList.add('kiosk-mode');
      state.ui.selectedPlayerId = KIOSK_PLAYER_ID;
      document.getElementById('tab-wellness').classList.add('active');
      renderWellness();
    } else {
      document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.tab==='dashboard'));
      document.getElementById('tab-dashboard').classList.add('active');
      renderDashboard();
    }

    document.getElementById('loading-veil').style.display='none';
    document.getElementById('app-shell').style.visibility='visible';

    attachLiveSync();
  }catch(err){
    console.error('Erreur au démarrage de Fab\'Lab :', err);
    const veil = document.getElementById('loading-veil');
    veil.innerHTML = `
      <div style="text-align:center;max-width:380px;padding:0 20px;">
        <div style="font-size:15px;font-weight:600;margin-bottom:10px;color:#fff;">Une erreur a empêché le chargement</div>
        <div style="font-size:12px;color:#ff9d7a;background:#1c1210;border:1px solid #4a2a20;border-radius:8px;padding:10px 14px;word-break:break-word;margin-bottom:14px;">${escapeHtml(err && err.message ? err.message : String(err))}</div>
        <div style="font-size:12px;color:#8994A3;margin-bottom:14px;">Faites une capture d'écran de ce message et envoyez-la pour que ce soit corrigé.</div>
        <button onclick="location.reload()" style="background:#E8661C;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;cursor:pointer;">Réessayer</button>
      </div>`;
    veil.style.display = 'flex';
    veil.style.flexDirection = 'column';
  }
}

boot();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

function comparisonBar(label, val, teamVal, toneFn){
  const tone = toneFn? toneFn(val).tone : 'accent';
  const max = Math.max(val||0, teamVal||0, 1)*1.15;
  return `<div>
    <div class="help-text" style="margin-bottom:6px;font-weight:600;color:var(--text-dim);">${label}</div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>Joueur</span><span class="mono">${val!=null?round1(val):'—'}</span></div>
    <div class="bar-track" style="margin-bottom:8px;"><div class="bar-fill" style="width:${val!=null?(val/max*100):0}%;background:${TONE_HEX[tone]};"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>Groupe</span><span class="mono">${teamVal!=null?round1(teamVal):'—'}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${teamVal!=null?(teamVal/max*100):0}%;background:${TONE_HEX.muted};"></div></div>
  </div>`;
}
</script>
